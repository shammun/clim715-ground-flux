<style>

body, html {
    width: 100vw; height: 100vh;
    font-family: 'Segoe UI', Calibri, Geneva, sans-serif;

.badge {

<body>
<div class="title-bar">
    <span class="badge">LITERATURE</span>
    <span class="slide-title">What Is Known: Meteorological Modulation of UHI</span>
</div>
<div class="table-area">
    <table class="lit-table">
        <thead><tr>
            <th style="width:42%;border-radius: 4px 0 0 4px;">Established</th>
            <th style="width:35%;">But limited to…</th>
            <th style="width:23%;border-radius: 0 4px 4px 0;">Reference</th>
        </tr></thead>
        <tbody>
        <tr class="lit-row active" id="row0">
            <td style="border-radius: 4px 0 0 4px; border-left: 4px solid transparent;">Precipitation-modulated, nonlinear scaling of surface UHI controlled by water and energy limits on ET — across &gt;30,000 cities globally</td>
            <td style="color: #8B4513;">City as single observation, not a within-city distribution</td>
            <td style="border-radius: 0 4px 4px 0; color: #6B7B8D; font-size: 13px;">Manoli et al. 2019</td>
        </tr>
        <tr class="lit-row muted" id="row1">
            <td style="border-radius: 4px 0 0 4px; border-left: 4px solid transparent;">Within-city temperature spread is wider on hotter days and warmer seasons (≤8.7 °C across Shenzhen stations; widening LST contrasts in warmer Sydney seasons; UHI as a distribution — 22 % of urban pixels cooler than rural in Portland)</td>
            <td style="color: #8B4513;">Categorical comparisons (warm vs. cool, summer vs. winter); no continuous sensitivity coefficient</td>
            <td style="border-radius: 0 4px 4px 0; color: #6B7B8D; font-size: 13px;">Cao et al. 2021; Naserikia et al. 2023; Potgieter et al. 2021; Moffett et al. 2019; Buyantuyev &amp; Wu 2010</td>
        </tr>
        <tr class="lit-row muted" id="row2">
            <td style="border-radius: 4px 0 0 4px; border-left: 4px solid transparent;">Antecedent moisture pre-conditions surface energy balance: dry weeks trigger soil-moisture-limited stomatal closure → wider impervious-vegetated LST gap; wet weeks sustain uniform ET → narrower gap</td>
            <td style="color: #8B4513;">Established mechanistically; never tested as a continuous predictor of σ<sub>LST</sub></td>
            <td style="border-radius: 0 4px 4px 0; color: #6B7B8D; font-size: 13px;">Hao et al. 2018, 2023; Manoli et al. 2019; Zhao et al. 2018</td>
        </tr>
        </tbody>
    </table>
</div>
<div class="footnote">Existing studies establish that meteorology modulates UHI <em>qualitatively</em>. None have provided a sensitivity coefficient (∂σ<sub>LST</sub>/∂T<sub>air</sub>, ∂σ<sub>LST</sub>/∂RH, ∂σ<sub>LST</sub>/∂precip<sub>7d</sub>) with uncertainty bounds usable for projection or planning.</div>
<div class="bottom-bar">
    <div class="step-dot active" onclick="goToStep(0)">1</div>
    <div class="step-dot" onclick="goToStep(1)">2</div>
    <div class="step-dot" onclick="goToStep(2)">3</div>
    <div class="step-title-text" id="stepTitle"></div>
</div>
<script>
    let currentStep = 0;
    const totalSteps = 3;
    const rows = [document.getElementById("row0"), document.getElementById("row1"),
    document.getElementById("row2")];
    const stepTitle = document.getElementById('stepTitle');
    const dots = document.querySelectorAll('.step-dot');
    const stepTitles = [
        "Climate-modulated UHI scaling — Manoli et al.",
        "Intra-urban thermal contrast — Cao, Naserikia, Potgieter, Moffett",
        "Antecedent moisture mechanism — Hao, Manoli, Zhao"
    ];
    function setRowClass(el, cls) { el.className = 'lit-row ' + cls; }
    function updateView() {
        dots.forEach((dot, i) => dot.classList.toggle('active', i === currentStep));
        stepTitle.innerHTML = stepTitles[currentStep];
        rows.forEach((row, i) => {
            if (i === currentStep) setRowClass(row, 'active');
            else if (i < currentStep) setRowClass(row, 'dimmed');
            else setRowClass(row, 'muted');
        });
    }
    function goToStep(step) {
        if (step < 0 || step >= totalSteps) return;
        currentStep = step;
        updateView();
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.code === 'Space' || e.key === 'n' || e.key === 'N') {
            e.preventDefault();
            if (currentStep < totalSteps - 1) { currentStep++; updateView(); }
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (currentStep > 0) { currentStep--; updateView(); }
        }
    });
    updateView();
</script>
</body>

            <td style="border-radius: 0 4px 4px 0; color: #6B7B8D; font-size: 13px;">Krayenhoff &amp; Voogt 2016; Yang &amp; Li 2015</td>
        </tr>
        </tbody>
    </table>
</div>
<div class="footnote">Vegetation and morphology are rarely studied <em>jointly</em> with meteorological variables on a within-city distribution. Cross-city analyses treat cities as single observations; pixel-level analyses hold meteorology constant.</div>
<div class="bottom-bar">
    <div class="step-dot active" onclick="goToStep(0)">1</div>
    <div class="step-dot" onclick="goToStep(1)">2</div>
    <div class="step-dot" onclick="goToStep(2)">3</div>
    <div class="step-dot" onclick="goToStep(3)">4</div>
    <div class="step-title-text" id="stepTitle"></div>
</div>
<script>
    let currentStep = 0;
    const totalSteps = 4;
    const rows = [document.getElementById("row0"), document.getElementById("row1"),
    document.getElementById("row2"), document.getElementById("row3")];
    const stepTitle = document.getElementById('stepTitle');
    const dots = document.querySelectorAll('.step-dot');
    const stepTitles = [
        "Vegetation cooling — Ziter, Allen",
        "Spatial arrangement &amp; form — Osborne, Mashhoodi",
        "Building morphology — Han, Li &amp; Hu, Wang",
        "Directional anisotropy — Krayenhoff &amp; Voogt"
    ];
    function setRowClass(el, cls) { el.className = 'lit-row ' + cls; }
    function updateView() {
        dots.forEach((dot, i) => dot.classList.toggle('active', i === currentStep));
        stepTitle.innerHTML = stepTitles[currentStep];
        rows.forEach((row, i) => {
            if (i === currentStep) setRowClass(row, 'active');
            else if (i < currentStep) setRowClass(row, 'dimmed');
            else setRowClass(row, 'muted');
        });
    }
    function goToStep(step) {
        if (step < 0 || step >= totalSteps) return;
        currentStep = step;
        updateView();
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.code === 'Space' || e.key === 'n' || e.key === 'N') {
            e.preventDefault();
            if (currentStep < totalSteps - 1) { currentStep++; updateView(); }
        } else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (currentStep > 0) { currentStep--; updateView(); }
        }
    });
    updateView();
</script>
</body>

        document.getElementById('row2'),
        document.getElementById('row3')
    ];
    var tips = [
        document.getElementById('tip0'),
        document.getElementById('tip1'),
        document.getElementById('tip2'),
        document.getElementById('tip3')
    ];
    var totalRows = 4;
    var currentStep = -1;

    function setRowState(idx, cls) { rows[idx].className = 'row-panel ' + cls; }
    function hideAllTooltips() { tips.forEach(function (t) { t.classList.remove('visible'); }); }

    function renderStep() {
        hideAllTooltips();
        if (currentStep < 0) {
            rows.forEach(function (r, i) { setRowState(i, 'muted'); });
        } else if (currentStep < totalRows) {
            rows.forEach(function (r, i) {
                if (i === currentStep) setRowState(i, 'active');
                else if (i < currentStep) setRowState(i, 'dimmed');
                else setRowState(i, 'muted');
            });
        } else {
            rows.forEach(function (r, i) { setRowState(i, 'full'); });
        }
    }

    function stepNext() { if (currentStep < totalRows) { currentStep++; renderStep(); } }
    function stepPrev() { if (currentStep > -1) { currentStep--; renderStep(); } }

    rows.forEach(function (row, idx) {
        row.addEventListener('mouseenter', function () {
            var canHover = (currentStep === idx) || (currentStep >= totalRows);
            if (!canHover) return;
            if (currentStep >= totalRows) row.className = 'row-panel full-hover';
            tips[idx].classList.add('visible');
        });
        row.addEventListener('mouseleave', function () {
            if (currentStep >= totalRows) row.className = 'row-panel full';
            tips[idx].classList.remove('visible');
        });
        row.addEventListener('mousemove', function (e) {
            var tip = tips[idx];
            if (tip && tip.classList.contains('visible')) {
                var x = e.clientX + 20;
                var y = e.clientY - 200;
                var tw = tip.classList.contains('dual') ? 900 : 560;
                var th = 420;
                if (x + tw > window.innerWidth) x = e.clientX - tw - 20;
                if (y < 10) y = 10;
                if (y + th > window.innerHeight - 10) y = window.innerHeight - th - 10;
                tip.style.left = x + 'px';
                tip.style.top = y + 'px';
            }
        });
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault(); stepNext();
        } else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft') {
            e.preventDefault(); stepPrev();
        }
    });

    renderStep();
</script>

}

<body>
<div class="title-bar">
    <span class="badge">BACKUP — INFERENCE</span>
    <span class="slide-title">CIs: What Each One Means and Why We Report Several</span>
</div>
<div class="content">

<div class="ci-card parametric">
    <div class="h"><span class="label">Parametric (Wald) CI</span> Standard model output</div>
    <div class="body">
        <b>Definition:</b> point estimate ± 1.96 × SE, with SE from the model's information matrix. Assumes the sampling distribution of the slope is approximately normal.
        <span class="when">Used for: ordinary linear coefficients (β<sub>1</sub>–β<sub>4</sub> on morphology) and for day-minus-night contrasts where SE is computed via the joint coefficient covariance.</span>
    </div>
</div>

<div class="ci-card simul">
    <div class="h"><span class="label">Simultaneous CI</span> Whole-curve inference</div>
    <div class="body">
        <b>Definition:</b> a band that covers the slope at <em>every</em> point along the smooth curve at once with 95 % probability — not at any single point. Constructed by simulating from the joint posterior of the spline coefficients and taking quantiles of the worst-case deviation across the predictor range (Marra &amp; Wood 2012; Simpson 2018).
        <b>Wider than pointwise:</b> it has to guard against false positives at every point along the curve.
        <span class="when">Used for: derivative-of-smooth slopes (∂σ<sub>LST</sub>/∂T<sub>air</sub> etc.). The <em>conservative</em> standard for whole-curve sensitivity inference.</span>
    </div>
</div>

<div class="ci-card boot">
    <div class="h"><span class="label">Bootstrap CI</span> Image-level resampling</div>
    <div class="body">
        <b>Definition:</b> resample 1,583 images with replacement (1,000 reps), refit the full HGAM each time, recompute the empirical-distribution-weighted mean derivative, take the [2.5 %, 97.5 %] quantiles. Makes <em>no</em> distributional assumption on the slope.
        <b>Targets the mean directly:</b> sharper than the simultaneous band when the question is about the average slope rather than the whole curve. At our n, bootstrap intervals are 2–5× narrower.
        <span class="when">Used for: the empirical-mean sensitivities. RH (day) and precip<sub>7d</sub> are bootstrap-supported even though their simultaneous bands include 0.</span>
    </div>
</div>

<div class="ci-card cred">
    <div class="h"><span class="label">Credible Interval (Bayesian posterior)</span> H4 cross-derivative</div>
    <div class="body">
        <b>Definition:</b> draw 5,000 samples from the joint posterior distribution of the spline coefficients on a 50 × 50 (T<sub>air</sub>, precip<sub>7d</sub>) grid, recompute the cross-derivative for each draw, take the central 95 %.
        <b>Why a credible interval and not a frequentist CI:</b> the cross-derivative is a derived quantity that depends on the whole tensor surface; the posterior naturally propagates uncertainty across all coefficients without needing a closed-form SE.
        <span class="when">Used for: H4 (∂²σ<sub>LST</sub>/(∂T<sub>air</sub>·∂precip<sub>7d</sub>)). Verified against the image-level bootstrap which gives a wider interval — both include 0.</span>
    </div>
</div>

<div class="takeaway">
    <b>How to read multiple intervals on the same number:</b> they answer slightly different questions. The simultaneous band is the strictest "is anywhere along this curve different from zero" guarantee. The bootstrap targets the empirical-weighted mean directly. When the bootstrap excludes 0 but the simultaneous band does not (RH day; precip<sub>7d</sub>), the curve has real structure but the structure is not strong enough to clear a uniform whole-curve threshold — we report both and let the reader judge.
</div>

</div>
</body>
</html></textarea>

<span class="lhs">σ_LST</span>(image t in city c) =<br>

<body>
<div class="title-bar">
    <span class="badge">BACKUP — H1 TEST</span>
    <span class="slide-title">How H1 Was Tested: Empirical-Mean Smooth Derivative</span>
</div>
<div class="content">

<div class="step-card">
    <div class="h"><span class="num">1</span>Why an empirical-mean derivative, not a single coefficient</div>
    <div class="body">A linear regression returns one slope. A smooth function s(T<sub>air</sub>) returns a <b>different</b> slope at every value of T<sub>air</sub> — gentle at the cold end, steep in the middle, possibly flatter at the warm end. To collapse this to one testable number we read off the slope at every observed predictor value and average those slopes, weighting by how often each value <em>actually occurs</em> in the data — the <b>empirical-distribution-weighted mean derivative</b>. That gives the average sensitivity across the conditions the cities actually experience, not at one cherry-picked point.</div>
</div>

<div class="step-card" style="border-left-color: #1565C0;">
    <div class="h" style="color: #1565C0;"><span class="num" style="background:#1565C0;">2</span>Computing the slope and its uncertainty</div>
    <div class="body">For each predictor we evaluate the smooth on a grid of 200 points spanning the empirical range, take a finite-difference derivative at each, then weight-average. For uncertainty we draw <b>10,000 sets of spline coefficients</b> from the model's posterior (multivariate-normal around the fitted coefficients with the model's coefficient covariance) and recompute the weighted-mean derivative for each draw. The 2.5 % and 97.5 % quantiles of those 10,000 means give us a <b>simultaneous CI</b> — wider than the more familiar pointwise band because it covers the slope <em>everywhere</em> on the curve at once (Marra &amp; Wood 2012; Simpson 2018). This is the conservative whole-curve standard.</div>
</div>

<div class="step-card" style="border-left-color: #2E7D32;">
    <div class="h" style="color: #2E7D32;"><span class="num" style="background:#2E7D32;">3</span>Bootstrap as a sharper alternative</div>
    <div class="body">In parallel, we resample the 1,583 images with replacement (1,000 reps), refit the full HGAM each time, recompute the empirical-mean derivative each time, and take the [2.5 %, 97.5 %] quantiles. This makes <b>no</b> distributional assumption and targets the mean directly — it is 2–5× narrower than the simultaneous band at our n. RH (day) and precip<sub>7d</sub> are bootstrap-supported even though their simultaneous bands include 0.</div>
</div>

<div class="result-card">
    <b>H1 verdict:</b> ∂σ<sub>LST</sub>/∂T<sub>air</sub> = +0.066 °C/°C day · +0.071 °C/°C night, both intervals exclude 0 under <em>both</em> criteria. ∂σ<sub>LST</sub>/∂RH = −0.004 %⁻¹ day, bootstrap [−0.0073, −0.0002]. ∂σ<sub>LST</sub>/∂precip<sub>7d</sub> = +0.002 mm⁻¹ day · +0.004 mm⁻¹ night, both bootstrap-supported. <b>H1 supported.</b>
</div>

</div>

<div class="title-bar">

    <span class="slide-title">How H2 Was Tested: Day-Minus-Night Contrast With Joint SE</span>
</div>
<div class="content">

<div class="step-card">
    <div class="h"><span class="num">1</span>Take the day and night mean slopes from H1 and difference them</div>
    <div class="body">For each predictor, the H1 step already gave us a daytime mean slope and a nighttime mean slope. H2 simply takes the difference: <b>Δ = mean Day-slope − mean Night-slope</b>. If Δ is reliably above zero, daytime is steeper. If reliably below zero, nighttime is steeper. If the CI straddles 0, we cannot distinguish them at this n.</div>
</div>

<div class="step-card" style="border-left-color: #1565C0;">
    <div class="h" style="color: #1565C0;"><span class="num" style="background:#1565C0;">2</span>SE(Δ) from joint coefficient covariance — not independent SEs</div>
    <div class="body">The day and night smooths are estimated from the <b>same</b> model fit and share information; their estimates are not independent. So we do not naively combine SE<sub>day</sub>² + SE<sub>night</sub>². Instead, we use the model's full coefficient covariance matrix V<sub>β</sub> and propagate uncertainty:
        <code>Var(Δ) = c<sup>T</sup> V<sub>β</sub> c</code>, where c is the linear contrast vector that picks out (mean Day-derivative − mean Night-derivative). This naturally accounts for the correlation between the two estimates. The 95 % CI on Δ is Δ ± 1.96 × SE(Δ).</div>

</div>

    <div class="body">Asks: is the joint surface ti(T<sub>air</sub>, precip<sub>7d</sub>) <b>more</b> than the sum of the two main-effect smooths? If T<sub>air</sub> and precip<sub>7d</sub> acted independently, knowing them together would add nothing once the two main smooths are in the model — the tensor surface would be flat. The model summary returns a p-value for whether this is the case. A small p means meaningful non-additive curvature.
        <br><br>
        <b>Result:</b> tensor EDF = 1.0, p = 0.118. EDF = 1 means the interaction is essentially linear on the log link at this n; p &gt; 0.05.</div>
</div>

<div class="step-card" style="border-left-color: #4A148C;">
    <div class="h" style="color: #4A148C;"><span class="num" style="background:#4A148C;">2</span>Test 2 — Empirical-mean cross-derivative (direct, more interpretable)</div>
    <div class="body">A direct estimate with physical units: how much does the σ<sub>LST</sub>-vs-T<sub>air</sub> slope change per mm of additional antecedent rainfall?
        <br><br>
        Procedure: at each of <b>5,000 posterior draws</b>, evaluate the fitted surface on a <b>50 × 50 grid</b> spanning the empirical (T<sub>air</sub>, precip<sub>7d</sub>) range. Compute the cross-derivative at each grid point via finite differences, weight-average across grid points, and record. The 2.5 % and 97.5 % quantiles of those 5,000 means give the <b>credible interval</b>.
        <br><br>
        <b>Result:</b> mean cross-derivative = +1.1 × 10⁻⁴, 95 % credible interval [−2.2 × 10⁻⁵, +2.4 × 10⁻⁴]. Includes 0.</div>
</div>

<div class="step-card" style="border-left-color: #2E7D32;">
    <div class="h" style="color: #2E7D32;"><span class="num" style="background:#2E7D32;">3</span>Why credible (Bayesian) here, not Wald (frequentist)</div>
    <div class="body">The cross-derivative is a derived quantity that depends on the entire tensor surface. There is no closed-form SE for it. The posterior simulation propagates uncertainty across <em>all</em> the spline coefficients simultaneously — naturally and without distributional assumptions. Verified against an image-level bootstrap which gives a wider interval that also includes 0.</div>
</div>

<div class="step-card" style="border-left-color: #B35C1E;">
    <div class="h" style="color: #B35C1E;"><span class="num" style="background:#B35C1E;">4</span>Robustness</div>
    <div class="body">Sign and magnitude preserved under alternative σ<sub>LST</sub> metrics (IQR; trimmed P95−P5 range). Leave-one-year-out cross-derivative ranges −5.9 × 10⁻⁵ to +4.4 × 10⁻⁴ across 2018–2025 — only the 2024 fold returns a slightly negative point estimate, and that estimate sits within the bootstrap envelope. Result is not a sampling-grid artifact (verified at 50 × 50, 5,000 samples).</div>
</div>

<div class="result-card">
    <b>H4 verdict — sign positive, not yet statistically resolved.</b> Both tests place the joint effect close to but indistinguishable from 0 at the 4-city sample size. The positive sign of the median is consistent with the moisture pre-conditioning mechanism — wet weeks let vegetated patches transpire freely, steepening the T<sub>air</sub> response (Manoli et al. 2019; Hao et al. 2023). The 8-city extension widens precipitation contrast (Phoenix, Seattle, LA, Denver) and is expected to raise statistical power for H4.
</div>

</div>
</body>
</html></textarea>

    <h3>What &ldquo;wiggliness&rdquo; means</h3>
    <p>The cyclic spline can land anywhere from a <span class="key">flat line</span> (1 EDF, data ignored) to an <span class="key">interpolation of all 12 monthly means</span> (6 EDF, every fluctuation fitted). Minimising training error alone always picks the wiggliest fit &mdash; and overfits.</p>
</div>

<div class="exp-card b">
    <div class="step-label">The penalty</div>
    <h3>Penalised likelihood</h3>
    <p>REML adds a wiggliness penalty to the likelihood:</p>
    <div class="formula">data fit &minus; &lambda; &middot; &int; ( f&Prime;(month) )<sup>2</sup> d&middot;month</div>
    <p>Higher <code>&lambda;</code> &rarr; smoother fit. <span class="key">REML estimates &lambda;</span> by integrating out the spline coefficients first &mdash; an unbiased criterion (Wood, 2011).</p>
</div>

<div class="exp-card c">
    <div class="step-label">The result</div>
    <h3>What REML actually chose</h3>
    <p><span class="key">&lambda; = 17.05</span> &rarr; EDF = 5.40 &mdash; close to the maximum of 6 but not interpolating. The seasonal cycle is captured at near-full flexibility while the spline still resists chasing noise.</p>
    <p><span class="key">k-index = 0.816</span> confirms the basis was adequate &mdash; the spline did not run out of room for the structure in the data.</p>
</div>

</div>

</div>
</body>
