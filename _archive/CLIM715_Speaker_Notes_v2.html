            {
                title: "Title",
                paragraphs: [
                    "Good morning. I'm Shammunul Islam from the Department of Atmospheric, Oceanic and Earth Sciences, and today I'm presenting my CLIM-715 course project on the numerical treatment of the one-dimensional ground heat conduction equation as it applies to urban land surfaces.",
                    "The project compares three classical time-stepping schemes — explicit forward Euler, implicit backward Euler, and Crank–Nicolson — running on three idealised urban substrate columns: an asphalt road, a concrete roof, and a bare soil reference. Each scheme is coupled to a fully prognostic surface energy balance, solved by Newton iteration at every time step.",
                    "The two questions I'll answer in this talk are: which scheme can survive a coarse time step on stiff urban substrates, and which substrate property best predicts how badly each scheme fails. I'll walk through the von Neumann analysis, the verification test, five results figures, two summary tables, the mechanism slide, the SHAP attribution, and finish with four findings — about twenty minutes total."
                ]
            },
            {
                title: "Why ground heat flux deserves numerical care",
                paragraphs: [
                    "Let me motivate the project. Of the four components of the surface energy budget — net radiation, sensible heat, latent heat, and conductive ground flux — the ground flux G is the smallest by daily mean, often near zero over a 24-hour average. But it is the single largest control on the diurnal range of surface temperature. During the day, pavements and roofs absorb solar radiation and store heat in the substrate; at night, that stored heat is released back to the surface and into the air. That nocturnal release is exactly what sustains the urban heat island for hours after sunset.",
                    "The physical length scale that matters here is the diurnal damping depth — the depth at which the daily temperature wave decays to about 37 percent of its surface amplitude. For the substrates I simulate, that's roughly 8 centimetres in dry soil, 10 in asphalt, and 14 in dense concrete. That length scale is small, which is why operational urban canopy schemes — like SLUCM and TEB — use centimetre-scale near-surface layers to resolve it.",
                    "And here is the consequence the rest of the talk is about: once you have centimetre-scale grid cells, the FTCS explicit stability bound on the concrete deck's top cell becomes about 17 seconds — far below the time step any operational model uses. So errors in the numerical treatment of G propagate directly into the simulated nocturnal urban heat island, and the choice of time-integration scheme becomes a structural problem, not a tuning issue."
                ]
            },
            {
                title: "1-D column anatomy — one column, one surface, four fluxes",
                paragraphs: [
                    "Here is the physical picture in one slide. Each urban substrate is modelled as a 2-metre-deep one-dimensional vertical column with depth-dependent thermal conductivity λ and heat capacity C — the layers you can see in the diagram. There is no horizontal transport: this is a vertical-only model, what an urban canopy scheme uses as a single tile.",
                    "At the top surface, four fluxes meet and have to balance. Net radiation R_n is the driver — shortwave absorbed plus longwave absorbed minus longwave emitted. Sensible heat H carries heat from the surface to the air. Latent heat LE we set to zero, by the strict-impervious assumption for asphalt and concrete. And the ground heat flux G is what carries heat into or out of the substrate — that is the variable we're trying to compute, and the variable whose numerical treatment matters.",
                    "Forcing comes from above as a synthetic diurnal cycle in shortwave-down, longwave-down, and air temperature, with a constant 3 metre-per-second wind. The output we diagnose is G at z equals zero, sampled through the second day of a two-day integration. The bottom boundary at z equals 2 metres is zero-flux Neumann — that's 14 to 25 damping depths down, where the daily wave is essentially gone."
                ]
            },
            {
                title: "Governing equation + four material numbers",
                paragraphs: [
                    "The governing equation is the one-dimensional vertical heat conduction equation in conductivity form: volumetric heat capacity C times the rate of change of temperature equals the spatial divergence of the conductive flux. I write it in conductivity form rather than diffusivity form on purpose. The layered urban substrates have λ and C that jump by an order of magnitude across interfaces, and only the conductivity form preserves the discrete heat content exactly across those jumps. The diffusivity form would lose energy at every layer boundary every step.",
                    "Four material numbers describe each substrate: thermal conductivity λ in watts per metre per kelvin, volumetric heat capacity C in joules per cubic metre per kelvin, thermal diffusivity κ which is λ over C, and thermal admittance μ which is the square root of λ times C. Diffusivity κ tells you how fast the temperature wave moves into the substrate. Admittance μ tells you how much heat the surface can absorb per kelvin of temperature swing. These two numbers will both turn up later as candidate predictors of scheme error.",
                    "Spatial discretisation is on a stretched grid — 0.5 centimetres at the surface, growing geometrically to about 30 centimetres at depth — to resolve the centimetre-scale damping zone while keeping the column thermally complete. Conductivity at half-levels uses the harmonic mean, which preserves the heat flux exactly across a discontinuity in λ. The arithmetic mean would over-estimate the flux across the concrete-to-insulation interface by roughly a factor of nineteen."
                ]
            },
            {
                title: "Surface energy balance — four fluxes balanced, Tₛ⁰ by Newton",
                paragraphs: [
                    "The top boundary is closed by the surface energy balance: net radiation equals the sum of sensible heat plus latent heat plus ground heat flux. Each of those four flux terms depends on the surface temperature Tₛ⁰. So Tₛ⁰ is not something we prescribe — it is the unknown that makes this equation balance. The whole point of the prognostic experiment is to let Tₛ⁰ emerge from this balance every step, the way it does in any modern land-surface scheme.",
                    "We solve it by Newton iteration on the residual F of Tₛ⁰, which equals R_n minus H minus LE minus G. We compute F and its analytical derivative at the current guess, take a Newton step, and repeat. Three to four iterations are enough to converge to within ten-to-the-minus-four kelvin per step. No finite-difference Jacobian — the Jacobian is hand-derived and exact, which makes each iteration fast and the convergence quadratic.",
                    "This is the prognostic SEB that distinguishes Test 2 from Test 1. In Test 1 we prescribed the surface temperature as a sinusoid for verification against an analytical solution. In Test 2 we let the SEB run prognostically, which is what generates the operator-splitting error we'll see in the results."
                ]
            },
            {
                title: "Three substrates spanning the urban-physics range",
                paragraphs: [
                    "Three idealised substrates were chosen on purpose to span the urban-physics range. The asphalt road has four layers — 5 centimetres of asphalt, 20 of aggregate base, 75 of dry soil, and a deep subsoil to 2 metres — with a moderately high top-layer diffusivity around 3.8 times 10 to the minus 7 metres squared per second. The concrete roof has three layers — about 10 centimetres of concrete deck, rigid mineral-wool insulation, and a drywall-and-wood interior — with the highest top-layer diffusivity around 7.1 times 10 to the minus 7, and the most extreme internal contrast where the concrete meets the insulation.",
                    "The bare soil reference is a single uniform sandy loam — no layering, lowest diffusivity around 2.3 times 10 to the minus 7. Albedos are 0.10 for asphalt, 0.30 for concrete, 0.25 for soil. The three substrates differ in top-layer diffusivity by a factor of about three, in bulk admittance by a factor of about three, and in layer structure by every conceivable measure.",
                    "These are not real city geometries — no buildings, no canyons, no facets. They are idealised 1-D columns chosen to span asphalt's moderate stiffness, concrete's extreme stiffness over an insulator, and a low-conductivity uniform reference. The mix lets us see whether scheme errors track κ_top, bulk admittance, layer structure, or all three — a question we'll close out with SHAP attribution."
                ]
            },
            {
                title: "Three substrates in 3D — visual anchor for the rest of the talk",
                paragraphs: [
                    "Here is a three-dimensional view of the three substrate columns from the previous slide. Each column is 2 metres deep, shown sticking down into the ground with the layers colour-coded by material — asphalt road on the left in purple, concrete roof in the middle in warm orange, and the uniform bare soil on the right in earth brown. There is no building above ground and no street between them; these are just the substrate columns laid out side by side for comparison.",
                    "The sun cycling overhead is the diurnal forcing — same forcing applied to all three columns. The columns are completely independent of each other: heat flows vertically only, downward into each column and back up to the surface, with no horizontal transport between them. In other words, the model treats each substrate as if it were the only thing in the world.",
                    "This slide is here to give you a clear mental image of the geometry before we move into boundary conditions and the numerical schemes. When I say 'asphalt' or 'concrete roof' for the rest of the talk, this is the geometry I mean — a 2-metre vertical column of layered material, sun above, deep zero-flux below."
                ]
            },
            {
                title: "Boundary conditions — top by SEB, bottom by zero flux",
                paragraphs: [
                    "The heat conduction equation is a second-order PDE in space, so it needs two boundary conditions — one at each end of the column. At the top, z equals zero, the boundary condition is the surface energy balance from the previous slide: Tₛ⁰ is the root of F equals zero, found by Newton each step. This is a Dirichlet-type condition, but with the surface temperature treated as an unknown rather than prescribed.",
                    "At the bottom, z equals 2 metres, we impose a zero-flux Neumann condition: the temperature gradient is zero. Physically this says no heat enters or leaves the column from below. Two metres is 14 damping depths down for concrete and 25 for soil. At that depth the daily temperature wave has decayed to less than one part in a million of its surface amplitude — essentially zero. So we can truncate the column there without affecting the diagnostics at the surface.",
                    "One small but important note: in the Test 1 verification experiment, the top BC is a prescribed sinusoid in Tₛ⁰ — that lets us check against the Carslaw–Jaeger analytical solution. In the Test 2 prognostic experiment, Tₛ⁰ is the SEB-balanced unknown. The bottom BC is the same in both — zero-flux at 2 metres."
                ]
            },
            {
                title: "Initial condition — damping-depth profile, skip the spin-up",
                paragraphs: [
                    "We need an initial vertical temperature profile to start each column at t equals zero. The naive choice — a uniform Tₛ throughout the column — would need several days of spin-up before the column reached its true diurnal quasi-equilibrium, because the deep layers would have to slowly absorb the diurnal cycle from the surface. That's expensive.",
                    "Instead, we initialise each column at midnight with the analytical damping-depth solution: T at depth z equals the daily mean T̄ plus the diurnal amplitude A times exp of minus z over d times cosine of minus z over d, where d equals the square root of 2 kappa over omega — the damping depth — using the topmost layer's effective diffusivity. Then we refine Tₛ⁰ with one Newton SEB step to close the surface energy budget at t equals zero.",
                    "This puts the column close enough to its true diurnal quasi-equilibrium that we only need to integrate two days. Day 1 absorbs the small phase mismatch between the simple damping-depth IC and the more complex SEB-driven actual cycle. Day 2 is the day we diagnose — that's where the figures and tables get their numbers."
                ]
            },
            {
                title: "θ-method family — three schemes, one implementation",
                paragraphs: [
                    "All three time-integration schemes are unified under a single α-weighted θ-method. The update equation evaluates the spatial Laplacian as a weighted combination of the old and new time levels: an α-fraction at the new time and a 1-minus-α fraction at the old time. α equals zero gives FTCS — fully explicit, fastest, but with the stability constraint. α equals one gives BTCS — fully implicit, unconditionally stable, but first-order accurate in time. α equals one half gives Crank–Nicolson — centred in time, unconditionally stable, and second-order accurate.",
                    "One implementation, three schemes — the same code path with a single parameter α decides which scheme is running. That matters because any bug in the spatial discretisation would affect all three identically; it cannot make one scheme look better or worse than another. So when we see scheme differences in the results, they are real consequences of the α value, not coding artifacts.",
                    "Computationally, FTCS is a single vectorised pass — O of N per step. BTCS and CN both produce a tridiagonal linear system at each step, solved by scipy's banded solver — also O of N per step but with a constant factor that's a few times larger than FTCS. So implicit is not much more expensive per step than explicit, which makes the speed advantage of taking a larger Δt very real in practice."
                ]
            },
            {
                title: "Figure 1 — Von Neumann amplification",
                paragraphs: [
                    "This figure is the von Neumann stability analysis — we drop one sine wave into the column and ask what each scheme does to it in a single time step. The x-axis is the wavelength of that wave measured in grid cells, with the right edge being the shortest wave the grid can resolve, two cells across. The y-axis is the amplification factor — anything above the dashed line at 1 means the wave grows each step, which is instability.",
                    "The four coloured curves are values of ν, the diffusion number — a single dial that combines the time step, the grid spacing, and the substrate's diffusivity. Look at FTCS on the left — at ν equals 0.5 the worst wave sits right on the bound, and at ν equals 5 it explodes to magnitude of A equals about 19, the textbook explicit-scheme instability. BTCS in the middle stays below 1 for every ν — that's unconditional stability — but at large ν it damps too aggressively, which is the source of its over-amplification bias on coarse Δt.",
                    "Crank–Nicolson on the right also stays at or below 1, but at ν equals 5 it barely damps the shortest wave, dropping only to about 0.82 — the noise mode is preserved, not killed. So three panels, three different failure modes — FTCS blows up, BTCS over-damps, CN can't damp the noise mode at large ν — and everything we see in the rest of the deck is a downstream consequence of these three trade-offs."
                ]
            },
            {
                title: "Figure 2 — Damping-depth verification (Test 1)",
                paragraphs: [
                    "This is the verification test — Test 1 — where we run all three schemes against a problem that has a known analytical answer. The setup is a uniform sandy-loam column with a prescribed sinusoidal temperature at the top, and the Carslaw–Jaeger analytical solution gives us the closed-form benchmark, shown as the black line in every panel.",
                    "Panel (a) is the vertical temperature profile at peak surface forcing — you see the daily wave decaying exponentially with depth and dying out by about 50 centimetres, and all three numerical schemes lie on top of the analytical curve. Panel (b) is the surface temperature over 24 hours — a clean sinusoid that the schemes reproduce to within fractions of a kelvin. Panel (c) is the surface ground heat flux, and the key feature is that G peaks about three hours before T does — that is the π over 4 phase lead from the analytical solution, and all schemes capture it correctly.",
                    "So before we touch the urban substrates or the prognostic energy balance, this slide confirms the heat-conduction kernel itself is implemented correctly — any differences we see between schemes from here on are real numerical effects, not bugs."
                ]
            },
            {
                title: "Figure 3 — Tₛ at Δt = 15 s, schemes agree",
                paragraphs: [
                    "We're now in Test 2, the prognostic experiment — the surface temperature is no longer prescribed, it emerges from balancing radiation, sensible heat, and ground flux. Three panels, three substrates: asphalt road, concrete roof, bare soil.",
                    "Δt is 15 seconds in every panel, which is below the FTCS stability bound on all three substrates, so the three schemes overlap to plotting precision — at small Δt the time-stepping choice doesn't matter. What does matter is the substrate: asphalt peaks at 50 degrees Celsius, concrete at 45, and — slightly surprisingly — bare soil at 51, the hottest of the three. The soil is hottest because its low thermal diffusivity traps absorbed heat near the surface, and we've assumed LE equals zero so there is no evaporative cooling to take that heat away.",
                    "These curves are the high-resolution reference: every Δt equals 600 second run on the next slide will be measured against this truth."
                ]
            },
            {
                title: "Figure 4 — G at Δt = 600 s, schemes diverge",
                paragraphs: [
                    "This is the headline result of the whole project — we've cranked Δt up from 15 seconds to 600 seconds, a coarse stress-test value approaching the time steps used in climate-model land-surface coupling, and the question is which scheme can survive it. The thick black line in every panel is the FTCS-at-15-seconds reference from the previous slide — that's our truth.",
                    "On asphalt and concrete, FTCS blows up immediately — you can see the BLEW UP labels — because ν exceeds the stability bound by 18 and 35 times respectively. BTCS doesn't blow up, but it systematically overshoots the daytime G peak by 40 percent on both stiff substrates — stable, but quantitatively very wrong. Crank–Nicolson is the only scheme that tracks the reference within a few watts per square metre on every substrate — the practical winner at coarse Δt on urban substrates.",
                    "On bare soil, even FTCS barely survives because the low diffusivity keeps ν close to the bound — that is why traditional rural land-surface schemes have gotten away with explicit time stepping, and why urban substrates are the harder problem."
                ]
            },
            {
                title: "Figure 5 — Where the error lives (asphalt profile)",
                paragraphs: [
                    "Figure 4 showed BTCS overshooting the asphalt's daytime G peak by 40 percent — this figure zooms into the column to see where in the depth that error actually lives. We plot vertical T profiles in the asphalt road, top 50 centimetres only, at three times on day 2 — 6 AM, noon, and 6 PM — with the FTCS-at-15-seconds reference in thick black.",
                    "At 6 AM during the slow nighttime cooling, the schemes overlap to plotting precision — nothing fast is happening, BTCS handles it fine. At noon, peak forcing, BTCS and CN sit about half a kelvin warmer than the reference in the top centimetre — the first sign of error. At 6 PM right after sunset, when the surface is cooling fast, BTCS holds the top of the column 2 kelvin above the truth, and the deviation is entirely concentrated in the top 5 centimetres — exactly the asphalt layer.",
                    "So the 40 percent G error from the previous slide isn't a column-wide problem — it's a thin near-surface problem in a single material layer, and CN with its second-order accuracy follows the rapid cooling far better than BTCS can."
                ]
            },
            {
                title: "Table 2 — 27-cell cross-substrate quantitative summary",
                paragraphs: [
                    "This table is the entire Test 2 experiment condensed into one place — 27 cells, three substrates by three schemes by three time steps. Each cell has three numbers separated by slashes: the diurnal G amplitude relative to the truth, the surface-temperature RMSE in kelvins, and the daily storage ratio. The cells marked BLEW UP are FTCS at 60 s on the concrete roof and FTCS at 600 s on every impervious substrate — those runs literally cannot finish.",
                    "Three patterns to take home. First, at the 600-second column the cross-substrate ordering of RMSE is consistent: soil errors are about a third of asphalt, which are about two thirds of roof — exactly the κ_top story we'll see on the mechanism slide. Second, in every single cell, CN errors are about half of BTCS — that's second-order versus first-order temporal accuracy showing up directly. Third, look at the rightmost number in every cell: every storage ratio is within five percent of unity, even where the amplitude is inflated by 40 percent — the error is symmetric day-and-night, so the daily mean is preserved.",
                    "The bottom line: BTCS and CN both get the daily energy budget right at any time step, but only CN delivers a usable diurnal amplitude at coarse Δt on urban substrates."
                ]
            },
            {
                title: "Table 3 — Δt-refinement ratios (smoking gun)",
                paragraphs: [
                    "Table 3 is the most important diagnostic in the whole project — it tells us what kind of error we're actually dealing with. The two RMSE columns are the temperature errors at Δt equals 60 seconds and 600 seconds; the rightmost column is just the ratio of the two. When you change Δt by a factor of 10 and the error changes by a factor of 10, that is the textbook signature of a first-order error in Δt.",
                    "Look down that column: every single value is close to 10 — between 8.2 and 10.2 — for both BTCS and CN, on every substrate. For BTCS that is expected: BTCS is intrinsically a first-order scheme. But Crank–Nicolson is intrinsically second-order — its own truncation error would have given a ratio of 100, not 10. So CN showing a ratio of 10 means CN's second-order accuracy is being masked by a separate first-order error that both schemes see — and that error is the operator splitting between the column update and the surface energy balance update.",
                    "This is the empirical evidence that licenses the next slide's κ_top argument and the SHAP confirmation that follows."
                ]
            },
            {
                title: "Figure 6 — SHAP attribution result",
                paragraphs: [
                    "The previous slide made a prediction — that κ_top should be the main thing controlling BTCS error. This slide is the test of that prediction using a completely different method. We made up 150 random urban substrates on the computer, with three layers each spanning realistic conductivity, heat capacity, and thickness ranges. For each substrate we ran BTCS at 600 seconds and BTCS at 15 seconds, recorded the RMSE between them as the score, and used SHAP to ask which of six substrate properties best predicts the score.",
                    "Panel (a) on the top-left is the headline — κ_top is the longest bar by a wide margin, three to four times longer than anything else, exactly what the previous slide predicted from physics. Panel (b) shows the dependence is monotone and near log-linear with admittance modulating the slope. Panel (c) removes κ_top and re-ranks the remaining five features — admittance jumps to the top, confirming it as the genuine second-place control just as the mechanism slide predicted. Panel (d) is the model-fit diagnostic.",
                    "The punchline: the previous slide picked κ_top using physics, this slide picks κ_top using machine learning on 150 random substrates — two completely different methods with nothing in common, and they give the same answer. Convergent evidence is the strongest evidence."
                ]
            },
            {
                title: "Conclusions — four findings + practical takeaway",
                paragraphs: [
                    "Let me close by pulling the four findings together. First, FTCS is structurally out — the stability bound is 17 seconds on the concrete deck and 33 seconds on asphalt, both below any time step a real model uses, so explicit time-stepping is ruled out by physics, not by tuning.",
                    "Second, the implicit schemes survive every run but they're not equally accurate — at coarse Δt, BTCS over-amplifies the daytime G by 40 percent on asphalt and concrete, while Crank–Nicolson cuts that to about 21 percent. Third, the error isn't BTCS's own truncation — refinement ratios near 10 for both BTCS and CN tell us the dominant error is the operator splitting, and the SHAP attribution identifies κ_top as the substrate parameter that sets its magnitude. Fourth, the daily-mean ground heat storage is preserved across schemes within plus-or-minus five percent — the bias isn't in the daily mean of the UHI, it's in the diurnal range, with simulated nights too warm and mornings too sharp.",
                    "The practical takeaway is simple: at coarse Δt on urban substrates, use Crank–Nicolson over BTCS — it cuts the error in half — and if you can afford it, replace the column-then-SEB splitting with a fully coupled solve, which removes the splitting error entirely. We're aware of the limitations: strict-impervious LE equals zero, symmetric synthetic forcing, isolated columns rather than facet-weighted urban canopies — and the natural next step is to couple this diagnostic framework to a real urban canopy scheme like WRF-SLUCM. The one-sentence summary: the time-integration scheme matters as much as the substrate physics, and once you control for it, κ_top alone tells you most of what you need to know about how badly each scheme will fail."

            var bar = document.getElementById('dotsBar');
            bar.innerHTML = '';
            for (var i = 0; i < totalSlides; i++) {
                var dot = document.createElement('div');
                dot.className = 'dot' + (i === currentSlide ? ' active' : (i < currentSlide ? ' visited' : ''));
                dot.textContent = i + 1;
                dot.onclick = (function(idx) { return function() { showSlide(idx); }; })(i);
                bar.appendChild(dot);
            }
        }

        function renderNotes() {
            var data = slides[NOTE_ORDER[currentSlide]];
            document.getElementById('slideIndicator').textContent = 'Slide ' + (currentSlide + 1) + ' / ' + totalSlides;
            document.getElementById('slideTitle').textContent = data.title;
            var container = document.getElementById('notesContainer');
            container.innerHTML = '';
            container.scrollTop = 0;
            data.paragraphs.forEach(function(text) {
                var p = document.createElement('div');
                p.className = 'note-paragraph';
                p.textContent = text;
                container.appendChild(p);
            });
        }

        function showSlide(n) {
            if (n < 0 || n >= totalSlides) return;
            currentSlide = n;
            renderNotes();
            renderDots();
            broadcastSlide(n);
        }

        function nextSlide() { if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1); }
        function prevSlide() { if (currentSlide > 0) showSlide(currentSlide - 1); }

        function updateTimerDisplay() {
            var m = Math.floor(timerSeconds / 60);
            var s = timerSeconds % 60;
            document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }

        function toggleTimer() {
            if (timerRunning) {
                clearInterval(timerInterval); timerRunning = false;
                document.getElementById('timer').classList.remove('running');
            } else {
                timerInterval = setInterval(function() { timerSeconds++; updateTimerDisplay(); }, 1000);
                timerRunning = true;
                document.getElementById('timer').classList.add('running');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval); timerRunning = false;
            timerSeconds = 0; updateTimerDisplay();
            document.getElementById('timer').classList.remove('running');
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'm' || e.key === 'M') { e.preventDefault(); nextSlide(); }
            else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); prevSlide(); }
            else if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleTimer(); }
            else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); resetTimer(); }
        });

        renderNotes();
        renderDots();
        updateTimerDisplay();
    </script>
</body>
</html>
