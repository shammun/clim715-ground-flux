<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Food Love — Ingredient Gallery</title>
<style>
  :root{
    --bg:#fff7f0; --card:#ffffff; --ink:#2b2118; --muted:#8a7a6b;
    --accent:#e0632e; --accent-soft:#fff0e6;
    --line:#efe2d6; --shadow:0 6px 22px rgba(180,110,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  header{
    background:var(--bg); padding:18px 16px 14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .brand .logo{font-size:30px}
  .brand h1{font-size:22px; margin:0; letter-spacing:.3px; font-weight:800}
  .brand h1 b{color:var(--accent)}
  .tag{font-size:13px; color:var(--muted); margin-top:2px}
  .count{display:inline-block; margin-left:6px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700; padding:3px 9px; border-radius:8px; vertical-align:middle}
  .searchwrap{margin-top:12px; display:flex; align-items:center; gap:10px;
    background:var(--card); border:2px solid var(--line); border-radius:14px;
    padding:11px 14px; box-shadow:var(--shadow)}
  .searchwrap:focus-within{border-color:var(--accent)}
  .searchwrap svg{flex:none}
  #q{flex:1; border:0; outline:0; font-size:16px; background:transparent; color:var(--ink)}
  #q::placeholder{color:#bcae9f}

  main{padding:16px 16px 60px; max-width:1200px; margin:0 auto}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px}
  .card{
    background:var(--card); border:2px solid var(--line); border-radius:18px;
    padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  .pic{
    width:100%; aspect-ratio:1/1; border-radius:13px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:54px;
    overflow:hidden; position:relative;
  }
  .pic img{width:100%; height:100%; object-fit:cover; display:block}
  .nm{font-size:17px; font-weight:800; line-height:1.25; text-align:center; color:var(--ink)}
  .empty{text-align:center; color:var(--muted); padding:60px 20px}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:18px 16px 30px}
  footer a{color:var(--accent); font-weight:700; text-decoration:none}

  @media(min-width:760px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:18px}
    .nm{font-size:18px}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">🍅</span>
    <div>
      <h1>Food <b>Love</b> — Ingredients <span class="count" id="cnt"></span></h1>
      <div class="tag">All ingredient photos, in one view.</div>
    </div>
  </div>
  <div class="searchwrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcae9f" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Filter… e.g. cheese, olive, sauce" autocomplete="off">
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div id="empty" class="empty" style="display:none">No ingredient matches that filter.</div>
</main>

<footer>
  Back to the full kitchen guide → <a href="food_love.html">food_love.html</a>
</footer>

<script>
/* Master list of ingredient photos (one per real ingredient). */
const ITEMS = [
  {name:"Provolone",            slug:"provolone"},
  {name:"Pesto",                slug:"pesto"},
  {name:"Parmesan cheese",      slug:"parmesan"},
  {name:"Asiago cheese",        slug:"asiago-cheese"},
  {name:"Cheddar cheese",       slug:"cheddar"},
  {name:"Mozzarella cheese",    slug:"mozzarella"},
  {name:"Chavez permason",      slug:"chavez-permason"},
  {name:"Pizza / tomato sauce", slug:"tomato-sauce"},
  {name:"Marinara sauce",       slug:"marinara"},
  {name:"Roasted red peppers",  slug:"roasted-red-peppers"},
  {name:"Italian sausage",      slug:"italian-sausage"},
  {name:"Chicken breast",       slug:"chicken-breast"},
  {name:"Pepperoni",            slug:"pepperoni"},
  {name:"Caramelized onions",   slug:"caramelized-onions"},
  {name:"Fresh mushrooms",      slug:"fresh-mushrooms"},
  {name:"Portabella mushrooms", slug:"portabella-mushrooms"},
  {name:"Black olives",         slug:"black-olives"},
  {name:"Kalamata olives",      slug:"kalamata-olives"},
  {name:"Bacon",                slug:"bacon"},
  {name:"Ground beef",          slug:"ground-beef"},
  {name:"Lettuce",              slug:"lettuce"},
  {name:"Red onions",           slug:"red-onions"},
  {name:"Ham",                  slug:"ham"},
  {name:"Green peppers",        slug:"green-peppers"},
  {name:"Lobster ravioli",      slug:"lobster-ravioli"},
  {name:"Feta cheese",          slug:"feta"},
  {name:"Prosciutto",           slug:"prosciutto"},
  {name:"Genoa salami",         slug:"genoa-salami"},
  {name:"Artichokes",           slug:"artichokes"},
];

function emojiFor(n){
  n=n.toLowerCase();
  const m=[["cheese","🧀"],["sauce","🥫"],["pesto","🌿"],["chicken","🍗"],["beef","🥩"],
   ["bacon","🥓"],["pepperoni","🥓"],["salami","🥓"],["prosciutto","🥓"],["ham","🥓"],
   ["sausage","🌭"],["mushroom","🍄"],["onion","🧅"],["olive","🫒"],["pepper","🫑"],
   ["lettuce","🥬"],["spinach","🥬"],["ravioli","🥟"],["artichoke","🌱"]];
  for(const [k,e] of m) if(n.includes(k)) return e;
  return "🍽️";
}

const grid=document.getElementById("grid");
const cnt=document.getElementById("cnt");
const empty=document.getElementById("empty");
const q=document.getElementById("q");

function render(){
  const term=q.value.trim().toLowerCase();
  const filtered = term ? ITEMS.filter(it=>it.name.toLowerCase().includes(term)) : ITEMS;
  cnt.textContent=filtered.length;
  grid.innerHTML="";
  if(!filtered.length){ empty.style.display="block"; return; }
  empty.style.display="none";
  filtered.forEach(it=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`<div class="pic">${emojiFor(it.name)}</div><div class="nm">${it.name}</div>`;
    const im=new Image();
    const slot=c.querySelector(".pic");
    im.onload=()=>{ slot.innerHTML=""; slot.appendChild(im); };
    im.onerror=()=>{};
    im.alt=it.name; im.src="food_love_images/ing/"+it.slug+".jpg";
    grid.appendChild(c);
  });
}

q.addEventListener("input", render);
render();
</script>
</body>
</html>
