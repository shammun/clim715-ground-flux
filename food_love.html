<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Food Love — Kitchen Prep Guide</title>
<style>
  :root{
    --bg:#fff7f0; --card:#ffffff; --ink:#2b2118; --muted:#8a7a6b;
    --accent:#e0632e; --accent-soft:#fff0e6; --gold:#f4b400; --gold-soft:#fff6d6;
    --line:#efe2d6; --ok:#2f9e6e; --shadow:0 6px 22px rgba(180,110,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  header{
    position:sticky; top:0; z-index:30; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .brand .logo{font-size:30px}
  .brand h1{font-size:21px; margin:0; letter-spacing:.3px}
  .brand h1 b{color:var(--accent)}
  .brand .tag{font-size:12px; color:var(--muted); margin-top:1px}
  .searchwrap{display:flex; gap:8px}
  .searchbox{
    flex:1; display:flex; align-items:center; gap:10px; background:var(--card);
    border:2px solid var(--line); border-radius:14px; padding:13px 15px; box-shadow:var(--shadow);
  }
  .searchbox:focus-within{border-color:var(--accent)}
  .searchbox svg{flex:none}
  #q{flex:1; border:0; outline:0; font-size:17px; background:transparent; color:var(--ink)}
  #q::placeholder{color:#bcae9f}
  .clearbtn{border:0;background:transparent;color:var(--muted);font-size:20px;display:none;cursor:pointer;padding:0 4px}
  .micbtn{
    flex:none; width:54px; border:0; border-radius:14px; background:var(--accent);
    color:#fff; font-size:22px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .micbtn:active{transform:scale(.96)}
  .micbtn.listening{background:#d23b3b; animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,59,59,.5)}70%{box-shadow:0 0 0 14px rgba(210,59,59,0)}100%{box-shadow:0 0 0 0 rgba(210,59,59,0)}}
  #voicehint{font-size:12px;color:var(--accent);min-height:16px;margin:7px 2px 0;font-weight:600}

  nav{display:flex; gap:8px; overflow-x:auto; padding:12px 16px; -webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  .chip{
    flex:none; border:2px solid var(--line); background:var(--card); color:var(--ink);
    padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .chip.fav.active{background:var(--gold); border-color:var(--gold); color:#5a4400}

  main{padding:4px 16px 90px; max-width:1000px; margin:0 auto}
  .sectiontitle{display:flex;align-items:center;gap:8px;margin:20px 4px 12px;font-size:17px;font-weight:800}
  .sectiontitle .count{font-size:12px;color:var(--muted);font-weight:600}
  .note{font-size:13px;color:var(--muted);margin:-4px 4px 14px;line-height:1.6;white-space:pre-line}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px}
  .card{
    background:var(--card); border:2px solid var(--line); border-radius:16px;
    padding:14px; cursor:pointer; box-shadow:var(--shadow); position:relative;
    display:flex; flex-direction:column; gap:8px; min-height:150px; transition:transform .08s;
  }
  .card:active{transform:scale(.97)}
  .card.fav{border-color:var(--gold); background:linear-gradient(180deg,var(--gold-soft),#fff 60%)}
  .star{position:absolute; top:10px; right:12px; font-size:18px}
  .thumb{
    width:100%; aspect-ratio:1/1; border-radius:12px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:46px; overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover}
  .card .name{font-size:15px; font-weight:800; line-height:1.25}
  .card .meta{font-size:12px; color:var(--muted); margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:6px}
  .price{color:var(--accent); font-weight:800}
  .cnt{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:7px;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}

  .overlay{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:50;display:none}
  .overlay.open{display:block}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-height:94vh; background:var(--card);
    border-radius:22px 22px 0 0; z-index:60; transform:translateY(100%);
    transition:transform .28s ease; display:flex; flex-direction:column;
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:10px auto 4px;flex:none}
  .sheethead{padding:8px 20px 14px; border-bottom:1px solid var(--line); flex:none; position:relative}
  .sheethead .hero{
    width:100%; height:140px; border-radius:16px; background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden;margin-bottom:12px}
  .sheethead .hero img{width:100%;height:100%;object-fit:cover}
  .sheethead h2{margin:0;font-size:24px;font-weight:800}
  .sheethead .sub{color:var(--muted);font-size:14px;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .closeX{position:absolute;top:12px;right:18px;background:rgba(0,0,0,.45);border:0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;color:#fff;backdrop-filter:blur(2px)}
  .sheetbody{padding:16px 16px 34px; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .ingbar{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 14px}
  .ingbar h3{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0}
  .ingbar .hint{font-size:12px;color:var(--muted)}
  .inggrid{display:flex;flex-direction:column;gap:18px}
  .ingtile{
    background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;
    display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
  .ingtile .nm{font-size:25px;font-weight:800;line-height:1.25;color:var(--ink);text-align:center}
  .ingtile .pic{
    width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:110px;overflow:hidden}
  .ingtile .pic img{width:100%;height:100%;object-fit:cover}
  .ingtile.flag{border:2px solid #e7b94d;background:#fff8e8}
  .ingtile.flag .pic{background:#fbe6bd;font-size:74px}
  .ingtile.flag .nm{color:#8a6a14;font-size:18px;font-weight:700;line-height:1.4}
  .noing{
    background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:14px;
    padding:22px;color:#9a4a22;font-size:15px;line-height:1.5;text-align:center}
  @media(min-width:760px){
    .sheet{left:50%;right:auto;width:620px;transform:translate(-50%,100%)}
    .sheet.open{transform:translate(-50%,0)}
  }
</style>
</head>

</div>

function emojiFor(name, cat){
  const n=(name+" "+cat).toLowerCase();
  const map=[["pizza","🍕"],["calzone","🥟"],["spaghetti","🍝"],["pasta","🍝"],["ravioli","🥟"],
    ["lasagna","🍝"],["manicotti","🍝"],["wing","🍗"],["chicken","🍗"],["steak","🥩"],
    ["burger","🍔"],["hamburger","🍔"],["gyro","🌯"],["wrap","🌯"],["sandwich","🥪"],
    ["fries","🍟"],["garlic bread","🧄"],["bread","🥖"],["hummus","🫓"],["mozzarella","🧀"],
    ["spinach","🥬"],["eggplant","🍆"],["mushroom","🍄"],["salad","🥗"],["feta","🧀"],
    ["dip","🫕"],["tiramisu","🍰"],["cake","🍰"],["cannoli","🥐"],["dessert","🍰"],
    ["tender","🍗"],["sampler","🍽️"],["margarita","🍕"],["hawaiian","🍍"]];
  for(const [k,e] of map){ if(n.includes(k)) return e; }
  return "🍽️";
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}

   ["feta","🧀"],["provolone","🧀"],["ricotta","🧀"],["cheese","🧀"],["basil","🌿"],
   ["herb","🌿"],["dough","🫓"],["pita","🫓"],["marinara","🥫"],["sauce","🥫"],
   ["chicken","🍗"],["turkey","🦃"],["gyro","🥩"],["beef","🥩"],["steak","🥩"],
   ["meatball","🧆"],["ham","🥓"],["bacon","🥓"],["prosciutto","🥓"],["salami","🥓"],
   ["pepperoni","🥓"],["sausage","🌭"],["spinach","🥬"],["greens","🥬"],["lettuce","🥬"],
   ["romaine","🥬"],["mushroom","🍄"],["eggplant","🍆"],["onion","🧅"],["garlic","🧄"],
   ["pepper","🫑"],["olive","🫒"],["pineapple","🍍"],["chickpea","🫘"],["hummus","🫓"],
   ["artichoke","🌱"],["spaghetti","🍝"],["penne","🍝"],["pasta","🍝"],["ravioli","🥟"],
   ["bread","🥖"],["fries","🍟"],["mayo","🥚"],["mustard","🥫"],["dressing","🥗"],
   ["vinaigrette","🥗"],["tahini","🥣"],["dip","🫕"],["pesto","🌿"]];
  for(const [k,e] of m) if(n.includes(k)) return e;
  return "🍽️";
}

MENU.forEach(g=>g.items.forEach(it=>{it._cat=g.cat;}));
const popularPin=MENU.find(g=>g.popularPin);
popularPin.items = MENU.flatMap(g=>g.items).filter(it=>it.popular);

let activeCat="Most Popular";
const elNav=document.getElementById("nav");
const elMain=document.getElementById("main");
const elQ=document.getElementById("q");
const elClear=document.getElementById("clear");

function renderNav(){
  elNav.innerHTML="";
  MENU.forEach(g=>{
    const b=document.createElement("button");
    b.className="chip"+(g.cat===activeCat?" active":"")+(g.popularPin?" fav":"");
    b.textContent=(g.popularPin?"⭐ ":"")+g.cat;
    b.onclick=()=>{activeCat=g.cat; elQ.value=""; elClear.style.display="none"; render();};
    elNav.appendChild(b);
  });
}

function cardEl(it){
  const c=document.createElement("div");
  c.className="card"+(it.popular?" fav":"");
  const n=(it.ing||[]).length;
  c.innerHTML=`
    ${it.popular?'<div class="star">⭐</div>':''}
    <div class="thumb">${emojiFor(it.name,it._cat)}</div>
    <div class="name">${it.name}</div>
    <div class="meta">
      <span class="price">${it.price?("$"+it.price):""}</span>
      ${n?`<span class="cnt">${n} ingredient${n!=1?'s':''}</span>`:''}
    </div>`;
  tryImg(c.querySelector(".thumb"), "food_love_images/"+slug(it.name)+".jpg");
  c.onclick=()=>openDetail(it);
  return c;
}

function tryImg(box, src){
  const im=new Image();
  im.onload=()=>{ box.innerHTML=""; box.appendChild(im); };
  im.onerror=()=>{};
  im.alt=""; im.src=src;
}

function render(){
  renderNav();
  const term=elQ.value.trim().toLowerCase();
  elMain.innerHTML="";
  let groups;
  if(term){
    const hits=MENU.filter(g=>!g.popularPin)
      .flatMap(g=>g.items)
      .filter(it=>it.name.toLowerCase().includes(term)||it._cat.toLowerCase().includes(term)
        ||(it.ing||[]).some(x=>x.toLowerCase().includes(term)));
    if(!hits.length){ elMain.innerHTML=`<div class="empty">No dish matches “${elQ.value}”.<br>Try a shorter word.</div>`; return; }
    groups=[{cat:`Results for “${elQ.value}”`, items:hits}];
  } else {
    groups=[MENU.find(x=>x.cat===activeCat)];
  }
  groups.forEach(g=>{
    const t=document.createElement("div");
    t.className="sectiontitle";
    t.innerHTML=`<span>${g.cat}</span><span class="count">${g.items.length} item${g.items.length!=1?'s':''}</span>`;
    elMain.appendChild(t);
    if(g.note){
      const nn=document.createElement("div");
      nn.className="note"; nn.textContent=g.note; elMain.appendChild(nn);
    }
    const grid=document.createElement("div"); grid.className="grid";
    g.items.forEach(it=>grid.appendChild(cardEl(it)));
    elMain.appendChild(grid);
  });
}

const overlay=document.getElementById("overlay");
const sheet=document.getElementById("sheet");
const dIng=document.getElementById("dIng");
let current=null;

function openDetail(it){
  current=it;
  const hero=document.getElementById("dHero");
  hero.innerHTML=emojiFor(it.name,it._cat);
  tryImg(hero, "food_love_images/"+slug(it.name)+".jpg");
  document.getElementById("dName").textContent=it.name;
  const sub=document.getElementById("dSub");
  sub.innerHTML="";
  const c1=document.createElement("span"); c1.textContent=it._cat; sub.appendChild(c1);
  if(it.price){const p=document.createElement("span");p.className="price";p.textContent="$"+it.price;sub.appendChild(p);}
  if(it.popular){const s=document.createElement("span");s.textContent="⭐ Most popular";s.style.color="#b58900";sub.appendChild(s);}
  renderIng();
  overlay.classList.add("open");
  (window.requestAnimationFrame||(cb=>setTimeout(cb,16)))(()=>sheet.classList.add("open"));
}

function renderIng(){
  const list=current.ing||[];
  const cnt=document.getElementById("dIngCount");
  dIng.innerHTML="";
  if(!list.length){
    cnt.textContent="";
    dIng.style.display="block";
    dIng.innerHTML=`<div class="noing">No ingredient list printed on the menu for <b>${current.name}</b>.</div>`;
    return;
  }
  dIng.style.display="flex";
  cnt.textContent="("+list.length+")";
  list.forEach((ing)=>{
    const isFlag = ing.indexOf("⚠")===0;
    const tile=document.createElement("div");
    if(isFlag){
      tile.className="ingtile flag";
      tile.innerHTML=`<div class="nm">${ing.replace(/^⚠\s*/,"")}</div><div class="pic">⚠</div>`;
    } else {
      tile.className="ingtile";
      tile.innerHTML=`<div class="nm">${ing}</div><div class="pic">${ingEmoji(ing)}</div>`;
      tryImg(tile.querySelector(".pic"), "food_love_images/ing/"+slug(ing)+".jpg");
    }
    dIng.appendChild(tile);
  });
}

function closeDetail(){
  sheet.classList.remove("open");
  setTimeout(()=>overlay.classList.remove("open"),260);
}
overlay.onclick=closeDetail;
document.getElementById("closeX").onclick=closeDetail;

elQ.addEventListener("input",()=>{ elClear.style.display=elQ.value?"block":"none"; render(); });
elClear.onclick=()=>{ elQ.value=""; elClear.style.display="none"; render(); };

const mic=document.getElementById("mic");
const vhint=document.getElementById("voicehint");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
  mic.addEventListener("click",()=>{ vhint.textContent="Voice not supported on this browser — please type instead."; });
} else {
  const rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.maxAlternatives=1;
  let listening=false;
  mic.addEventListener("click",()=>{ listening?rec.stop():rec.start(); });
  rec.onstart=()=>{ listening=true; mic.classList.add("listening"); vhint.textContent="Listening… say a dish name"; };
  rec.onerror=(e)=>{ vhint.textContent = e.error==="not-allowed" ? "Microphone blocked — allow mic access or type instead." : "Didn’t catch that — tap 🎤 and try again."; };
  rec.onend=()=>{ listening=false; mic.classList.remove("listening"); };
  rec.onresult=(e)=>{
    let txt=""; for(const r of e.results) txt+=r[0].transcript;
    txt=txt.trim();
    elQ.value=txt; elClear.style.display=txt?"block":"none";
    vhint.textContent=txt?('Heard: “'+txt+'”'):"";
    render();
  };
}

renderNav(); render();
</script>
</body>
</html>
