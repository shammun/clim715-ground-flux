    <div class="col">

      <ul class="points">

  <div class="title-bar">

        <div class="eq">C<sub>j</sub>&Delta;z<sub>j</sub> (T<sub>j</sub><sup>n+1</sup> &minus; T<sub>j</sub><sup>n</sup>)/&Delta;t =</div>
        <div class="eq">&alpha; [&minus;&part;G/&part;z]<sup>n+1</sup> + (1&minus;&alpha;) [&minus;&part;G/&part;z]<sup>n</sup></div>
      </div>
      <div class="note">
        One equation, three schemes: choose &alpha;.
      </div>
      <div class="pills">
        <div class="pill ftcs"><span class="alpha">&alpha; = 0</span><span class="name">FTCS</span></div>
        <div class="pill cn"><span class="alpha">&alpha; = &frac12;</span><span class="name">Crank&ndash;Nicolson</span></div>
        <div class="pill btcs"><span class="alpha">&alpha; = 1</span><span class="name">BTCS</span></div>
      </div>
      <div class="note" style="margin-top:14px">
        Implicit cases (&alpha; &gt; 0) need a tridiagonal solve each step &mdash; <b>O(N) cost</b> with the SciPy banded solver.
      </div>
      <div class="bc-table">
        <span class="lbl">Top BC:</span>
        <span>SEB closure R<sub>n</sub> &minus; H &minus; LE &minus; G = 0, solved for T<sub>s</sub><sup>0</sup> by Newton iteration to |&Delta;T| &lt; 10<sup>&minus;4</sup> K.</span>
        <span class="lbl">Bottom BC:</span>

      </div>
    </div>

<body>
  <div class="title-bar">
    <span class="badge">Stability bound &mdash; live</span>

    <span class="eq">&Delta;t<sub>max</sub> = &frac12; &Delta;z&sup2; / &kappa;</span>
  </div>
  <div class="ref-legend">
    Vertical reference lines:
    <strong style="color:#c2492a">17 s</strong> &mdash; FTCS bound at &Delta;z = 5 mm
    <span class="sep">&middot;</span>
    <strong style="color:#b89854">60 s</strong> &mdash; representative mesoscale &Delta;t
    <span class="sep">&middot;</span>
    <strong style="color:#2c8a83">600 s</strong> &mdash; coarse-&Delta;t stress-test (CAM/CLASS use 900&ndash;1800 s)
  </div>

    <div class="row1">
      <span class="dz-label">&Delta;z =</span>
      <span class="dz-value" id="dz-value">10.0 mm</span>

  <div class="plot-card">
    <svg class="barplot" id="barplot" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="punch" id="punch">
    Drag the slider to see the bound collapse.
  </div>

<script>
"use strict";

// Substrate properties — most thermally stiff TOP layer of each column.
//   Asphalt road:  top is asphalt itself.   λ = 0.75, C ≈ 2.0e6 → κ = 3.75e-7 m²/s
//   Concrete roof: top is concrete deck.    λ = 1.50, C ≈ 2.0e6 → κ = 7.50e-7 m²/s
//   Bare soil:     uniform sandy loam.      κ from report = 2.31e-7 m²/s
// At Δz = 5 mm in concrete: Δt_max = ½(0.005)²/7.5e-7 ≈ 17 s — matches report.
var SUBS = [
  { key: 'asphalt', label: 'Asphalt road',  sub: 'top: asphalt (λ=0.75)',   kappa: 3.75e-7, color: '#6b5cb5' },
  { key: 'roof',    label: 'Concrete roof', sub: 'top: concrete (λ=1.50)',  kappa: 7.50e-7, color: '#d97757' },
  { key: 'soil',    label: 'Bare soil',     sub: 'sandy loam (κ=2.3e-7)',   kappa: 2.31e-7, color: '#8b6f3a' }
];

// Slider 0..100 → Δz in mm (log spaced from 1 mm to 100 mm).
var DZ_MIN_MM = 1;
var DZ_MAX_MM = 100;
function dzFromSlider(v) {
  var t = v / 100;
  return Math.pow(10, Math.log10(DZ_MIN_MM) + t * (Math.log10(DZ_MAX_MM) - Math.log10(DZ_MIN_MM)));
}
function sliderFromDz(dz_mm) {
  return 100 * (Math.log10(dz_mm) - Math.log10(DZ_MIN_MM)) / (Math.log10(DZ_MAX_MM) - Math.log10(DZ_MIN_MM));
}

// Δt log-x bounds (0.1 s to 100 000 s ≈ 28 hours).
var X_MIN_S = 0.1;
var X_MAX_S = 1e5;
var X_RANGE = Math.log10(X_MAX_S) - Math.log10(X_MIN_S);

// SVG layout. On mobile we use a near-square viewBox so the chart
// fills the phone screen vertically without distorting text via
// preserveAspectRatio=none. PAD adapts proportionally so the bars
// still have their existing left/right padding for axis labels.
var IS_MOBILE = (typeof window !== 'undefined' && window.matchMedia &&
                 window.matchMedia('(max-width: 760px)').matches);
var SVG_W = 1000;
var SVG_H = IS_MOBILE ? 1000 : 320;
// PAD.left is bumped on mobile (and modestly on desktop) because the
// substrate row labels ("Asphalt road" etc.) need room at fs(14) =
// 42 user units on mobile / 21 on desktop. PAD.top is also bumped so
// the reference labels (17 s / 60 s / 600 s) above the dashed lines
// don't get clipped above the SVG top edge after the font scale-up.
var PAD = IS_MOBILE
  ? { top: 110, right: 140, bottom: 90, left: 320 }
  : { top: 64,  right: 140, bottom: 50, left: 220 };
var PLOT_W = SVG_W - PAD.left - PAD.right;
var PLOT_H = SVG_H - PAD.top - PAD.bottom;
// Font-size helper: text in user units scales with the SVG, so to land
// at a readable rendered size we multiply by ~3 on mobile (where the
// SVG is rendered at scale ~0.34) and ~1.5 on desktop (scale ~0.8).
var FS_MUL = IS_MOBILE ? 3.0 : 1.5;
function fs(n)  { return String(Math.round(n * FS_MUL)); }    // returns string for SVG attrs
function off(n) { return Math.round(n * FS_MUL); }            // returns number for y-offsets

var NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  var el = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function xPx(s) {
  var v = Math.log10(Math.max(s, X_MIN_S * 0.5));
  return PAD.left + ((v - Math.log10(X_MIN_S)) / X_RANGE) * PLOT_W;
}

var svg = document.getElementById('barplot');
svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);

// Decade gridlines
var DECADES = [0.1, 1, 10, 100, 1000, 10000, 100000];
var DECADE_LABELS = ['0.1', '1', '10', '100', '1k', '10k', '100k'];

// Operational reference lines.
var REFS = [
  { s: 17,  label: '17 s', color: '#c2492a' },
  { s: 60,  label: '60 s', color: '#b89854' },
  { s: 600, label: '600 s', color: '#2c8a83' }
];

// Background zones — red < 60 s, amber 60–600 s, green > 600 s.
function drawAxes() {
  var redEnd   = xPx(60);
  var amberEnd = xPx(600);
  svg.appendChild(svgEl('rect', {
    x: PAD.left, y: PAD.top,
    width: redEnd - PAD.left, height: PLOT_H,
    fill: 'rgba(194, 73, 42, 0.05)'
  }));
  svg.appendChild(svgEl('rect', {
    x: redEnd, y: PAD.top,
    width: amberEnd - redEnd, height: PLOT_H,
    fill: 'rgba(184, 152, 84, 0.06)'
  }));
  svg.appendChild(svgEl('rect', {
    x: amberEnd, y: PAD.top,
    width: PAD.left + PLOT_W - amberEnd, height: PLOT_H,
    fill: 'rgba(56, 178, 172, 0.05)'
  }));
  // Decade gridlines + tick labels
  for (var i = 0; i < DECADES.length; i++) {
    svg.appendChild(svgEl('line', {
      x1: xPx(DECADES[i]), y1: PAD.top,
      x2: xPx(DECADES[i]), y2: PAD.top + PLOT_H,
      stroke: 'rgba(107, 92, 181, 0.10)', 'stroke-width': '1'
    }));
    var lab = svgEl('text', {
      x: xPx(DECADES[i]), y: PAD.top + PLOT_H + off(18),
      'text-anchor': 'middle', 'font-size': fs(12), fill: '#6b7186',
      'font-family': 'Cascadia Code, Consolas, monospace'
    });
    lab.textContent = DECADE_LABELS[i];
    svg.appendChild(lab);
  }
  // X-axis title
  var xLab = svgEl('text', {
    x: PAD.left + PLOT_W / 2, y: PAD.top + PLOT_H + off(40),
    'text-anchor': 'middle', 'font-size': fs(13), fill: '#4a5066',
    'font-weight': '600'
  });
  xLab.textContent = 'FTCS Δt_max (seconds, log scale)';
  svg.appendChild(xLab);
  // Reference lines + labels
  for (var r = 0; r < REFS.length; r++) {
    var ref = REFS[r];
    svg.appendChild(svgEl('line', {
      x1: xPx(ref.s), y1: PAD.top - 12,
      x2: xPx(ref.s), y2: PAD.top + PLOT_H,
      stroke: ref.color, 'stroke-width': '1.6',
      'stroke-dasharray': '5 4', opacity: '0.75'
    }));
    var refLab = svgEl('text', {
      x: xPx(ref.s), y: PAD.top - off(16),
      'text-anchor': 'middle', 'font-size': fs(11), fill: ref.color,
      'font-weight': '700', 'font-family': 'Cascadia Code, Consolas, monospace'
    });
    refLab.textContent = ref.label;
    svg.appendChild(refLab);
  }
  // Substrate row labels
  var rowH = PLOT_H / SUBS.length;
  for (var s = 0; s < SUBS.length; s++) {
    var sub = SUBS[s];
    var yC = PAD.top + (s + 0.5) * rowH;
    var lblName = svgEl('text', {
      x: PAD.left - off(14), y: yC - off(6),
      'text-anchor': 'end', 'font-size': fs(14), fill: sub.color,
      'font-weight': '700'
    });
    lblName.textContent = sub.label;
    svg.appendChild(lblName);
    var lblSub = svgEl('text', {
      x: PAD.left - off(14), y: yC + off(18),
      'text-anchor': 'end', 'font-size': fs(10.5), fill: '#6b7186',
      'font-style': 'italic'
    });
    lblSub.textContent = sub.sub;
    svg.appendChild(lblSub);
  }
}
drawAxes();

// Bars + value labels.
var bars = [];
var barLabels = [];
var rowH = PLOT_H / SUBS.length;
var barH = rowH * 0.50;
for (var s = 0; s < SUBS.length; s++) {
  var yC = PAD.top + (s + 0.5) * rowH;
  var bar = svgEl('rect', {
    x: PAD.left, y: yC - barH/2,
    width: 0, height: barH,
    fill: SUBS[s].color, opacity: '0.92', rx: '3'
  });
  svg.appendChild(bar);
  bars.push(bar);
  var lbl = svgEl('text', {
    x: PAD.left, y: yC + off(5),
    'font-size': fs(14), fill: '#ffffff',
    'font-weight': '700',
    'font-family': 'Cascadia Code, Consolas, monospace',
    'text-anchor': 'start'
  });
  svg.appendChild(lbl);
  barLabels.push(lbl);
}

function fmtSeconds(s) {
  if (s < 1)    return s.toFixed(2) + ' s';
  if (s < 60)   return s.toFixed(1) + ' s';
  if (s < 3600) return (s / 60).toFixed(1) + ' min';
  return (s / 3600).toFixed(1) + ' hr';
}
function fmtDz(dz_mm) {
  return dz_mm < 10 ? dz_mm.toFixed(2) + ' mm' : dz_mm.toFixed(1) + ' mm';
}

function update() {
  var dz_mm = dzFromSlider(parseFloat(slider.value));
  var dz_m  = dz_mm / 1000;
  document.getElementById('dz-value').textContent = fmtDz(dz_mm);

  var concreteDt = 0;
  for (var s = 0; s < SUBS.length; s++) {
    var dt_max = 0.5 * dz_m * dz_m / SUBS[s].kappa;
    var x0 = xPx(X_MIN_S);
    var x1 = xPx(dt_max);
    var w = Math.max(2, x1 - x0);
    bars[s].setAttribute('width', w);
    var labelText = fmtSeconds(dt_max);
    var lbl = barLabels[s];
    lbl.textContent = labelText;
    if (w > off(80)) {
      lbl.setAttribute('x', x0 + off(8));
      lbl.setAttribute('fill', '#ffffff');
    } else {
      lbl.setAttribute('x', x1 + off(8));
      lbl.setAttribute('fill', SUBS[s].color);
    }
    if (SUBS[s].key === 'roof') concreteDt = dt_max;
  }

  // Punchline — depends on which zone concrete falls into.
  var punch = document.getElementById('punch');
  var dzTxt = 'Δz = ' + fmtDz(dz_mm);
  var dtTxt = 'Δt &lt; ' + fmtSeconds(concreteDt);
  if (concreteDt < 60) {
    punch.innerHTML =
      'At <span class="v">' + dzTxt + '</span>: FTCS on concrete needs <span class="v">' + dtTxt +
      '</span> &mdash; <b>below any operational mesoscale step</b>. Implicit treatment is structurally required.';
  } else if (concreteDt < 600) {
    punch.innerHTML =
      'At <span class="v">' + dzTxt + '</span>: FTCS on concrete now allows <span class="v">' + dtTxt +
      '</span> &mdash; usable for short steps but not for sub-hourly operational configurations.';
  } else {
    punch.innerHTML =
      'At <span class="v">' + dzTxt + '</span>: FTCS allows <span class="v">' + dtTxt +
      '</span>, but <b>this Δz fails to resolve the diurnal damping depth (~8&ndash;12 cm)</b>.';
  }
}

// Slider wiring.
var slider = document.getElementById('dz-slider');
slider.addEventListener('input',  update);
slider.addEventListener('change', update);

// Clickable preset ticks.
var PRESETS = [
  { mm: 1,   label: '1' },
  { mm: 5,   label: '5' },
  { mm: 10,  label: '10' },
  { mm: 25,  label: '25' },
  { mm: 50,  label: '50' },
  { mm: 100, label: '100' }
];
var ticksDiv = document.getElementById('ticks');
PRESETS.forEach(function(preset) {
  var tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = sliderFromDz(preset.mm) + '%';
  tick.textContent = preset.label;
  tick.addEventListener('click', function() {
    slider.value = String(sliderFromDz(preset.mm));
    update();
  });
  ticksDiv.appendChild(tick);
});

// Arrow-key nudges (Shift = ×5).
window.addEventListener('keydown', function(e) {
  if (e.target && e.target.tagName === 'INPUT' && e.target !== slider) return;
  var step = e.shiftKey ? 5 : 1;
  if (e.key === 'ArrowLeft') {
    slider.value = String(Math.max(0, parseFloat(slider.value) - step));
    update();
    e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    slider.value = String(Math.min(100, parseFloat(slider.value) + step));
    update();
    e.preventDefault();
  }
});

update();
</script>

</body>
</html></textarea>

  }

  .tick:hover { color: #6b5cb5; background: rgba(107, 92, 181, 0.08); }

  /* Plot card */
  .plot-card {
    flex: 1;
    margin: 0 52px 8px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(107, 92, 181, 0.10);

</style>
</head>
<body>
  <div class="title-bar">
    <span class="badge">Mechanism &mdash; live</span>
    <span class="slide-title">BTCS smears the post-swing gradient at the &lambda; jump</span>
  </div>
  <div class="subtitle">
    Vertical temperature profile through the concrete-roof column. A
    <b>&times;37 thermal-conductivity jump</b> at z = 10 cm &mdash; concrete deck
    (&lambda; = 1.50 W m<sup>&minus;1</sup> K<sup>&minus;1</sup>) over mineral-wool insulation (&lambda; = 0.04) &mdash;
    concentrates the temperature gradient at the layer interface. Drag the time slider:
    at coarse &Delta;t, BTCS visibly distorts the curvature where the conductivity jumps.
  </div>

  <div class="control-card">
    <div class="row1">
      <span class="t-label">t =</span>
      <span class="t-value" id="t-value">14:00</span>
      <div class="slider-wrap">
        <input type="range" class="t-slider" id="t-slider" min="0" max="95" step="1" value="56">
        <div class="ticks" id="ticks"></div>
      </div>
    </div>
  </div>

  <div class="plot-card">
    <svg class="profile" id="profile" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend-bar">
      <div class="item" style="color:#2c8a83">
        <span class="swatch"></span><span>fine-grid reference (&Delta;t = 15 s)</span>
      </div>
      <div class="item" style="color:#d97757">
        <span class="swatch"></span><span>BTCS &Delta;t = 60 s</span>
      </div>
      <div class="item" style="color:#c2492a">
        <span class="swatch dashed"></span><span>BTCS &Delta;t = 600 s</span>
      </div>
    </div>
  </div>

  <div class="punch" id="punch">
    Drag the slider through the diurnal cycle &mdash; watch the kink at z = 10 cm round off as &Delta;t grows.
  </div>

<script>
"use strict";

// =============================================================
// FAITHFUL PORT of run_experiments.py run_column() for the
// concrete-roof column. BTCS at three Δt values (15, 60, 600 s)
// with prognostic SEB Newton iteration at the top boundary,
// stretched grid (n_levels=30, stretch=1.18, dz1=0.005), full
// 2 m column, Neumann zero-flux at the bottom — operator-split
// column-then-SEB ordering each step (the splitting analyzed
// in long report §5.2). Snapshots day-2 profiles every 15 min.
// =============================================================

// --- atmospheric-forcing constants (run_experiments.py) ----
var SIGMA_SB = 5.670374419e-8;
var ALBEDO   = 0.30;     // concrete_roof
var EMIS     = 0.92;
var C_H      = 5.0e-3;
var RHO_AIR  = 1.2;
var CP_AIR   = 1005.0;
var U_WIND   = 3.0;
var OMEGA    = 2.0 * Math.PI / 86400.0;

// (z_bottom, λ, C) — matches run_experiments.py SUBSTRATES["concrete_roof"]
var LAYERS_PROJECT = [
  [0.10, 1.50,  2.1e6 ],
  [0.20, 0.04,  0.08e6],
  [2.00, 0.15,  1.5e6 ]
];

// Visualization layer info (top 30 cm — for shading/labels in the plot)
var LAYERS = [
  { name: 'concrete',   z0: 0.00, z1: 0.10, lambda: 1.50, C: 2.1e6  },
  { name: 'insulation', z0: 0.10, z1: 0.20, lambda: 0.04, C: 0.08e6 },
  { name: 'drywall',    z0: 0.20, z1: 0.30, lambda: 0.15, C: 1.5e6  }
];

var Z_MAX = 0.30;  // top 30 cm shown; full simulation runs to z = 2 m

// --- forcing functions (run_experiments.py) ---
function S_down(t) {
  return Math.max(1000.0 * Math.cos(OMEGA * (t - 12 * 3600.0)), 0.0);
}
function L_down(t) {
  return 350.0 + 20.0 * Math.cos(OMEGA * (t - 14 * 3600.0));
}
function T_air(t) {
  return 292.5 + 7.5 * Math.cos(OMEGA * (t - 14 * 3600.0));
}

// --- stretched grid (matches make_grid in run_experiments.py) ---
function makeGrid(zTop, nLevels, stretch, dz1) {
  var dzs = [];
  for (var i = 0; i < nLevels; i++) dzs.push(dz1 * Math.pow(stretch, i));
  var sum = 0;
  for (var i = 0; i < dzs.length; i++) sum += dzs[i];
  if (sum > zTop) {
    var cum = 0;
    for (var i = 0; i < nLevels; i++) {
      cum += dzs[i];
      if (cum > zTop) {
        nLevels = i + 1;
        dzs = dzs.slice(0, nLevels);
        break;
      }
    }
  }
  var sumPrev = 0;
  for (var i = 0; i < nLevels - 1; i++) sumPrev += dzs[i];
  dzs[nLevels - 1] = zTop - sumPrev;
  var z = [dzs[0] / 2.0];
  for (var j = 1; j < nLevels; j++) {
    z.push(z[j - 1] + (dzs[j - 1] + dzs[j]) / 2.0);
  }
  var dzc = [];
  for (var j = 1; j < nLevels; j++) dzc.push(z[j] - z[j - 1]);
  return { z: z, dzs: dzs, dzc: dzc };
}

// --- per-cell λ, C; harmonic-mean λ at half-levels ---
function assignLayeredProps(z, layers) {
  var N = z.length;
  var lam = new Array(N);
  var C = new Array(N);
  for (var j = 0; j < N; j++) {
    lam[j] = layers[layers.length - 1][1];
    C[j] = layers[layers.length - 1][2];
    for (var i = 0; i < layers.length; i++) {
      if (z[j] <= layers[i][0]) {
        lam[j] = layers[i][1];
        C[j] = layers[i][2];
        break;
      }
    }
  }
  var lamHalf = new Array(N - 1);
  for (var j = 0; j < N - 1; j++) {
    lamHalf[j] = 2.0 / (1.0 / lam[j] + 1.0 / lam[j + 1]);
  }
  return { lam: lam, C: C, lamHalf: lamHalf };
}

// --- SEB residual (R_n − H − G = 0; LE = 0) and Newton iteration ---
function sebResidual(Ts0, Tint, dzc0, lamH0, t) {
  var Sd = S_down(t);
  var Ld = L_down(t);
  var Ta = T_air(t);
  var rA = 1.0 / (C_H * U_WIND);
  var Rn = (1.0 - ALBEDO) * Sd + EMIS * Ld - EMIS * SIGMA_SB * Math.pow(Ts0, 4);
  var H = RHO_AIR * CP_AIR * (Ts0 - Ta) / rA;
  var G = lamH0 * (Ts0 - Tint) / dzc0;
  return Rn - H - G;
}
function sebDerivative(Ts0, dzc0, lamH0) {
  var rA = 1.0 / (C_H * U_WIND);
  return -4.0 * EMIS * SIGMA_SB * Math.pow(Ts0, 3) - RHO_AIR * CP_AIR / rA - lamH0 / dzc0;
}
function solveSEB(Tint, dzc0, lamH0, t, Ts0Init) {
  var Ts0 = Ts0Init;
  for (var iter = 0; iter < 20; iter++) {
    var f = sebResidual(Ts0, Tint, dzc0, lamH0, t);
    var df = sebDerivative(Ts0, dzc0, lamH0);
    var dTs = -f / df;
    Ts0 += dTs;
    if (Math.abs(dTs) < 1e-4) return Ts0;
  }
  return Ts0;
}

// --- initial profile: damping-depth analytic (Option B init in the report) ---
function initialProfile(z, T0, Aamp, kappaEff) {
  var d = Math.sqrt(2.0 * kappaEff / OMEGA);
  var T = new Array(z.length);
  for (var j = 0; j < z.length; j++) {
    T[j] = T0 + Aamp * Math.exp(-z[j] / d) * Math.cos(-z[j] / d);
  }
  return T;
}

// --- Thomas tridiagonal solve ---
function thomas(sub, mid, sup, rhs) {
  var n = rhs.length;
  var c = new Array(n);
  var d = new Array(n);
  c[0] = sup[0] / mid[0];
  d[0] = rhs[0] / mid[0];
  for (var i = 1; i < n; i++) {
    var m = mid[i] - sub[i] * c[i - 1];
    c[i] = (i < n - 1) ? sup[i] / m : 0;
    d[i] = (rhs[i] - sub[i] * d[i - 1]) / m;
  }
  var x = new Array(n);
  x[n - 1] = d[n - 1];
  for (var i = n - 2; i >= 0; i--) x[i] = d[i] - c[i] * x[i + 1];
  return x;
}

// --- BTCS step. Top: T[0] is Dirichlet (set by SEB outside). Bottom: Neumann zero-flux. ---
function buildBTCSMatrix(dt, dzs, dzc, lamHalf, C) {
  var N = dzs.length;
  var sub = new Array(N).fill(0);
  var mid = new Array(N).fill(1.0);
  var sup = new Array(N).fill(0);
  for (var j = 1; j < N - 1; j++) {
    var a = dt * lamHalf[j - 1] / (C[j] * dzs[j] * dzc[j - 1]);
    var b = dt * lamHalf[j]     / (C[j] * dzs[j] * dzc[j]);
    sub[j] = -a;
    mid[j] = 1.0 + a + b;
    sup[j] = -b;
  }
  // Top row: T[0] = T_top → mid[0]=1, sup[0]=0, sub[0]=0
  // Bottom row: Neumann (T[N-1] = T[N-2]) → mid[N-1]=1, sub[N-1]=-1
  sub[N - 1] = -1.0;
  return { sub: sub, mid: mid, sup: sup };
}
function btcsStep(T, mat, Ttop) {
  var rhs = T.slice();
  rhs[0] = Ttop;
  rhs[rhs.length - 1] = 0.0; // Neumann zero-flux RHS
  return thomas(mat.sub, mat.mid, mat.sup, rhs);
}

// --- 2-day BTCS-SEB integration; return 96 day-2 profiles (every 15 min) ---
function runBTCS_SEB(dt) {
  var grid = makeGrid(2.0, 30, 1.18, 0.005);
  var props = assignLayeredProps(grid.z, LAYERS_PROJECT);
  var lam = props.lam, C = props.C, lamHalf = props.lamHalf;
  var z = grid.z, dzs = grid.dzs, dzc = grid.dzc;
  var N = z.length;

  var kappaTop = lam[0] / C[0];
  var T = initialProfile(z, 292.5, 7.5, kappaTop);
  T[0] = solveSEB(T[1], dzc[0], lamHalf[0], 0.0, T[0]);

  var totalSeconds = 2 * 86400;
  var nSteps = Math.round(totalSeconds / dt);
  var dtUse = totalSeconds / nSteps;
  var mat = buildBTCSMatrix(dtUse, dzs, dzc, lamHalf, C);

  var SNAP_DT_S = 900;
  var snaps = [];
  for (var i = 0; i < 96; i++) snaps.push(null);
  var nextSnapIdx = 0;
  var nextSnapTime = 86400;

  var t = 0;
  for (var step = 0; step < nSteps; step++) {
    var tNew = t + dtUse;
    // Operator-split column-then-SEB (long report §5.2):
    T = btcsStep(T, mat, T[0]);                                     // Step 1: column
    T[0] = solveSEB(T[1], dzc[0], lamHalf[0], tNew, T[0]);          // Step 2: SEB Newton
    t = tNew;

    while (nextSnapIdx < 96 && t >= nextSnapTime - 1e-6) {
      snaps[nextSnapIdx] = T.slice();
      nextSnapIdx++;
      nextSnapTime += SNAP_DT_S;
    }
    if (nextSnapIdx >= 96) break;
  }
  for (var i = 0; i < 96; i++) {
    if (snaps[i] === null) snaps[i] = T.slice();
  }
  return { z: z, snaps: snaps };
}

// --- precompute three runs ---
var t0 = performance.now();
var REF_RUN   = runBTCS_SEB(15);
var DT60_RUN  = runBTCS_SEB(60);
var DT600_RUN = runBTCS_SEB(600);
var elapsed = (performance.now() - t0).toFixed(0);

var Z_FULL = REF_RUN.z;
var SNAPS = {
  ref:    REF_RUN.snaps,
  dt60:   DT60_RUN.snaps,
  dt600:  DT600_RUN.snaps
};

// --- restrict the plot to the top 30 cm ---
var nPlot = 0;
for (var j = 0; j < Z_FULL.length; j++) {
  if (Z_FULL[j] > 0.30) break;
  nPlot = j + 1;
}
// Z_PLOT places T[0] visually at z = 0 (surface convention).
var Z_PLOT = new Array(nPlot);
Z_PLOT[0] = 0;
for (var j = 1; j < nPlot; j++) Z_PLOT[j] = Z_FULL[j];

// First cell below the concrete/insulation interface (z = 0.10 m).
var IFACE_CELL = nPlot - 1;
for (var j = 0; j < nPlot; j++) {
  if (Z_FULL[j] > 0.10) { IFACE_CELL = j; break; }
}

// --- auto-scale T axis (in °C) ---
var TMIN = Infinity, TMAX = -Infinity;
['ref', 'dt60', 'dt600'].forEach(function(k) {
  for (var i = 0; i < 96; i++) {
    var s = SNAPS[k][i];
    for (var j = 0; j < nPlot; j++) {
      var Tc = s[j] - 273.15;
      if (Tc < TMIN) TMIN = Tc;
      if (Tc > TMAX) TMAX = Tc;
    }
  }
});
TMIN = Math.floor(TMIN - 1);
TMAX = Math.ceil(TMAX + 1);

// =============================================================
// Plot. On mobile use a portrait viewBox so the SVG aspect-ratio
// fills the phone screen vertically without distorting text — the
// depth profile naturally elongates which actually helps mobile
// readability of the depth axis.
// =============================================================
var IS_MOBILE = (typeof window !== 'undefined' && window.matchMedia &&
                 window.matchMedia('(max-width: 760px)').matches);
var SVG_W = 1000;
var SVG_H = IS_MOBILE ? 1200 : 420;
var PAD = IS_MOBILE
  ? { top: 30, right: 130, bottom: 60, left: 60 }
  : { top: 22, right: 130, bottom: 38, left: 60 };
// Font/offset scaling — the SVG is rendered at scale ~0.34 on mobile
// and ~0.8 on desktop; multiply user-unit font sizes by these inverses
// to land readable rendered pixel sizes.
var FS_MUL = IS_MOBILE ? 3.0 : 1.5;
function fs(n)  { return String(Math.round(n * FS_MUL)); }
function off(n) { return Math.round(n * FS_MUL); }
var PLOT_W = SVG_W - PAD.left - PAD.right;
var PLOT_H = SVG_H - PAD.top - PAD.bottom;

var NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  var el = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function xPx(T) { return PAD.left + ((T - TMIN) / (TMAX - TMIN)) * PLOT_W; }
function yPx(z) { return PAD.top  + (z / Z_MAX) * PLOT_H; }

var svg = document.getElementById('profile');
svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + SVG_H);

// Layer shading.
var LAYER_FILLS = {
  concrete:   'rgba(154, 154, 154, 0.18)',
  insulation: 'rgba(232, 216, 168, 0.35)',
  drywall:    'rgba(200, 180, 138, 0.25)'
};
LAYERS.forEach(function(L) {
  svg.appendChild(svgEl('rect', {
    x: PAD.left, y: yPx(L.z0),
    width: PLOT_W, height: yPx(L.z1) - yPx(L.z0),
    fill: LAYER_FILLS[L.name]
  }));
  // Layer label on the right.
  var lab = svgEl('text', {
    x: PAD.left + PLOT_W + off(8),
    y: (yPx(L.z0) + yPx(L.z1)) / 2 + off(4),
    'font-size': fs(11), fill: '#4a5066',
    'font-style': 'italic'
  });
  lab.textContent = L.name + ' λ=' + L.lambda;
  svg.appendChild(lab);
});

// Layer interface lines.
LAYERS.slice(0, -1).forEach(function(L) {
  svg.appendChild(svgEl('line', {
    x1: PAD.left, x2: PAD.left + PLOT_W,
    y1: yPx(L.z1), y2: yPx(L.z1),
    stroke: '#6b7186', 'stroke-width': '1', 'stroke-dasharray': '3 3'
  }));
});

// "λ ratio ×37" call-out at the concrete/insulation interface.
var iface_y = yPx(0.10);
var callX = PAD.left + off(8);
var callW = off(90);
var callH = off(22);
svg.appendChild(svgEl('rect', {
  x: callX, y: iface_y - callH/2, width: callW, height: callH,
  rx: callH/2,
  fill: '#c2492a'
}));
var callT = svgEl('text', {
  x: callX + callW/2, y: iface_y + off(3),
  'text-anchor': 'middle', 'font-size': fs(11), fill: '#fff',
  'font-weight': '700'
});
callT.textContent = 'λ ratio ×37';
svg.appendChild(callT);

// Axes.
svg.appendChild(svgEl('line', {
  x1: PAD.left, x2: PAD.left + PLOT_W,
  y1: PAD.top + PLOT_H, y2: PAD.top + PLOT_H,
  stroke: '#9aa3b8'
}));
svg.appendChild(svgEl('line', {
  x1: PAD.left, x2: PAD.left,
  y1: PAD.top, y2: PAD.top + PLOT_H,
  stroke: '#9aa3b8'
}));

// X tick labels (T axis).
for (var T = Math.ceil(TMIN/5)*5; T <= TMAX; T += 5) {
  svg.appendChild(svgEl('line', {
    x1: xPx(T), x2: xPx(T),
    y1: PAD.top, y2: PAD.top + PLOT_H,
    stroke: 'rgba(107, 92, 181, 0.08)'
  }));
  var tl = svgEl('text', {
    x: xPx(T), y: PAD.top + PLOT_H + off(16),
    'text-anchor': 'middle', 'font-size': fs(11), fill: '#6b7186'
  });
  tl.textContent = T.toFixed(0);
  svg.appendChild(tl);
}
svg.appendChild((function() {
  var t = svgEl('text', {
    x: PAD.left + PLOT_W / 2, y: PAD.top + PLOT_H + off(34),
    'text-anchor': 'middle', 'font-size': fs(12), fill: '#4a5066', 'font-weight': '600'
  });
  t.textContent = 'temperature (°C)';
  return t;
})());

// Y tick labels (depth).
[0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30].forEach(function(z) {
  svg.appendChild(svgEl('line', {
    x1: PAD.left - 4, x2: PAD.left,
    y1: yPx(z), y2: yPx(z),
    stroke: '#9aa3b8'
  }));
  var lt = svgEl('text', {
    x: PAD.left - off(8), y: yPx(z) + off(4),
    'text-anchor': 'end', 'font-size': fs(11), fill: '#6b7186'
  });
  lt.textContent = (z * 100).toFixed(0);
  svg.appendChild(lt);
});
svg.appendChild((function() {
  var t = svgEl('text', {
    x: off(18), y: PAD.top + PLOT_H / 2,
    'text-anchor': 'middle', 'font-size': fs(12), fill: '#4a5066', 'font-weight': '600',
    transform: 'rotate(-90 ' + off(18) + ' ' + (PAD.top + PLOT_H / 2) + ')'
  });
  t.textContent = 'depth z (cm)';
  return t;
})());

// Three curve paths.
function makeCurve(stroke, dash, width) {
  var p = svgEl('path', {
    fill: 'none', stroke: stroke,
    'stroke-width': width, 'stroke-linejoin': 'round',
    'stroke-linecap': 'round'
  });
  if (dash) p.setAttribute('stroke-dasharray', dash);
  svg.appendChild(p);
  return p;
}
var pathRef   = makeCurve('#2c8a83', null,  '2.6');
var path60    = makeCurve('#d97757', null,  '2.0');
var path600   = makeCurve('#c2492a', '6 4', '2.6');

function profileToPath(snap) {
  // snap is in Kelvin (full 26-cell column); plot only the top 30 cm in °C.
  var d = '';
  for (var i = 0; i < nPlot; i++) {
    var Tc = snap[i] - 273.15;
    d += (i === 0 ? 'M ' : ' L ') + xPx(Tc).toFixed(2) + ' ' + yPx(Z_PLOT[i]).toFixed(2);
  }
  return d;
}

function fmtTime(idx) {
  var totalMin = idx * 15;
  var h = Math.floor(totalMin / 60);
  var m = totalMin % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function update() {
  var idx = parseInt(slider.value, 10);
  document.getElementById('t-value').textContent = fmtTime(idx);
  var ref  = SNAPS.ref[idx];
  var s60  = SNAPS.dt60[idx];
  var s600 = SNAPS.dt600[idx];
  pathRef.setAttribute('d',  profileToPath(ref));
  path60.setAttribute('d',   profileToPath(s60));
  path600.setAttribute('d',  profileToPath(s600));

  // Punchline: surface T error, BTCS-600 vs ref. Differences in K (= differences in °C).
  var dTsurf = (s600[0] - ref[0]);

  <div class="title-bar">
    <span class="badge">Governing physics</span>
    <span class="slide-title">The heat conduction equation &amp; the four material numbers that drive everything</span>

    <div class="col">
      <h3>Conductivity-form heat equation</h3>
      <div class="eq-block">
        <div class="eq">C<sub>s</sub>(z) &part;T<sub>s</sub>/&part;t &nbsp;=&nbsp; &part;/&part;z [&lambda;<sub>s</sub>(z) &part;T<sub>s</sub>/&part;z]</div>
      </div>
      <div class="note">
        In words: the volumetric heat capacity times the rate of temperature change at depth <em>z</em> equals the divergence of the conductive flux. Heat <em>piles up</em> wherever more flux enters from above than leaves below.
      </div>
      <div class="note">
        Why <b>conductivity form</b> (not diffusivity form): &lambda; and C jump by orders of magnitude across material interfaces (e.g., concrete deck&rarr;mineral wool: &lambda; drops 37&times;). Keeping them inside the derivative preserves <em>discrete heat conservation</em>.
      </div>
      <div class="note">
        <b>Fourier's law</b> sits inside: G(z) = &minus; &lambda;<sub>s</sub>(z) &part;T<sub>s</sub>/&part;z. <em>G &gt; 0</em> is downward (into the substrate). The minus sign encodes the second law: heat flows from hot to cold.
      </div>
      <ul class="prop-list">

        <li class="kap"><b>Thermal diffusivity &kappa; = &lambda;/C</b> [m<sup>2</sup> s<sup>&minus;1</sup>]: how fast the <em>temperature</em> responds. Sets every numerical stability bound.</li>
        <li class="dep"><b>Damping depth d = &radic;(2&kappa;/&omega;)</b> [m]: depth at which the daily wave decays to 37% of the surface amplitude. Sets the required &Delta;z.</li>
      </ul>
    </div>

    <div class="col">
      <h3>Values for the three substrates (top layer)</h3>
      <table class="props">
        <thead>

      </div>

<textarea id="t2" style="display:none"><!DOCTYPE html>

<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100vw; height: 100vh; font-family: 'Segoe UI', Calibri, Geneva, sans-serif; background: #eaf0f8; color: #2c3142; overflow: hidden; display: flex; flex-direction: column; }
  .title-bar { padding: 24px 52px 8px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .badge { background: #38b2ac; color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 12px; border-radius: 4px; text-transform: uppercase; }

<body>
  <div class="title-bar">
    <span class="badge">Surface energy balance</span>
    <span class="slide-title">The top boundary condition &mdash; four fluxes balanced, T<sub>s</sub><sup>0</sup> solved by Newton</span>
  </div>
  <div class="seb-headline">
    <div class="seb-eq">
      <span class="lbl">SEB residual</span>
      F(T<sub>s</sub><sup>0</sup>) &nbsp;=&nbsp; R<sub>n</sub>(T<sub>s</sub><sup>0</sup>) &minus; H(T<sub>s</sub><sup>0</sup>) &minus; LE &minus; G(T<sub>s</sub><sup>0</sup>) &nbsp;=&nbsp; 0
    </div>
  </div>
  <div class="panels">

    <div class="flux rn">
      <div class="sym">R<sub>n</sub></div>
      <div class="lbl">Net radiation</div>
      <div class="formula">(1 &minus; &alpha;<sub>s</sub>) S&darr; &nbsp;+&nbsp; &epsilon;<sub>s</sub> L&darr; &nbsp;&minus;&nbsp; &epsilon;<sub>s</sub> &sigma; (T<sub>s</sub><sup>0</sup>)<sup>4</sup></div>
      <div class="note">
        Absorbed shortwave + absorbed longwave &minus; emitted longwave.&nbsp;<b>The &sigma; T<sup>4</sup> Stefan&ndash;Boltzmann term is what makes the SEB nonlinear.</b>&nbsp;
        Driver of the diurnal cycle; positive when energy is being deposited at the surface.
      </div>
    </div>

    <div class="flux h">
      <div class="sym">H</div>
      <div class="lbl">Sensible heat</div>
      <div class="formula">&rho; c<sub>p</sub> (T<sub>s</sub><sup>0</sup> &minus; T<sub>a</sub>) / r<sub>a</sub>,&nbsp; r<sub>a</sub> = 1/(C<sub>H</sub>U)</div>
      <div class="note">
        Bulk-aerodynamic formula. Heat exchanged with the air, scaled by aerodynamic resistance r<sub>a</sub>. With U = 3 m/s, r<sub>a</sub> &asymp; 67 s/m. <b>Linear in T<sub>s</sub><sup>0</sup>.</b>
      </div>
    </div>

    <div class="flux le">
      <div class="sym">LE</div>
      <div class="lbl">Latent heat</div>
      <div class="formula" style="color:#5a6178; font-size: 16px; margin-top: 12px;">LE = 0</div>
      <div class="note">
        Strict-impervious assumption: <b>no evaporation</b>. Realistic for new pavement; under-estimates real urban latent flux. Removes one term from the SEB without losing the numerical mechanism we study.
      </div>
    </div>

    <div class="flux g">
      <div class="sym">G</div>
      <div class="lbl">Ground heat (top face)</div>
      <div class="formula">&lambda;<sub>&frac12;</sub> (T<sub>s</sub><sup>0</sup> &minus; T<sub>1</sub>) / (z<sub>1</sub> &minus; z<sub>0</sub>)</div>
      <div class="note">
        Conductive flux from surface into the substrate, using the harmonic-mean conductivity at the top half-level. Couples the SEB to the column. <b>Linear in T<sub>s</sub><sup>0</sup></b> (T<sub>1</sub> held fixed during the Newton iteration).
      </div>
    </div>

  </div>
  <div class="newton">
    <b>Why Newton iteration?</b> The &sigma; (T<sub>s</sub><sup>0</sup>)<sup>4</sup> term is nonlinear in T<sub>s</sub><sup>0</sup>, so F(T<sub>s</sub><sup>0</sup>) = 0 cannot be solved algebraically.
    Starting from the previous step's surface temperature, Newton finds the root by linearising F around the current guess:
    <span class="neq">T<sub>s,new</sub><sup>0</sup> &nbsp;=&nbsp; T<sub>s,old</sub><sup>0</sup> &nbsp;&minus;&nbsp; F(T<sub>s,old</sub><sup>0</sup>) / F &prime;(T<sub>s,old</sub><sup>0</sup>)</span>
    The Jacobian F&prime; = &minus;4&epsilon;<sub>s</sub>&sigma;(T<sub>s</sub><sup>0</sup>)<sup>3</sup> &minus; &rho;c<sub>p</sub>/r<sub>a</sub> &minus; &lambda;<sub>&frac12;</sub>/&Delta;z is computed <em>analytically</em>.
    Convergence to |&Delta;T| &lt; 10<sup>&minus;4</sup> K typically in <b>3&ndash;4 iterations</b>.
  </div>
</body>
</html></textarea>

<textarea id="t4" style="display:none"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100vw; height: 100vh; font-family: 'Segoe UI', Calibri, Geneva, sans-serif; background: #eaf0f8; color: #2c3142; overflow: hidden; display: flex; flex-direction: column; }

  .note em { color: #6b5cb5; font-style: normal; font-weight: 600; }

<body>
  <div class="title-bar">
    <span class="badge">Boundary conditions</span>
    <span class="slide-title">A 2<sup>nd</sup>-order PDE needs two BCs &mdash; one at z = 0, one at z = 2&nbsp;m</span>
  </div>
  <div class="headline">Top BC closes the system to the atmosphere; bottom BC closes it deep below the daily wave.</div>
  <div class="content">

    <div class="bc top">
      <h3>TOP &nbsp; (z = 0) &nbsp; &mdash; &nbsp; Dirichlet on T<sub>s</sub><sup>0</sup>, set by the SEB</h3>
      <div class="desc">Test&nbsp;2 (production): solve for T<sub>s</sub><sup>0</sup>. Test&nbsp;1 (verification): prescribe T<sub>s</sub><sup>0</sup>(t).</div>
      <div class="eq-block">
        <div class="eq">T<sub>0</sub><sup>n+1</sup> &nbsp;=&nbsp; T<sub>s</sub><sup>0,&nbsp;n+1</sup></div>
      </div>
      <div class="note"><b>Test 2.</b> Surface temperature is the <em>unknown</em>: root of the SEB residual <em>F(T<sub>s</sub><sup>0</sup>) = R<sub>n</sub> &minus; H &minus; LE &minus; G = 0</em>, found by Newton iteration each step. The four flux terms physically depend on T<sub>s</sub><sup>0</sup>; only the value that balances them is consistent.</div>
      <div class="note"><b>Test 1.</b> Surface temperature is <em>prescribed</em>: T<sub>s</sub><sup>0</sup>(t) = 292.5&nbsp;+&nbsp;7.5&nbsp;cos(&omega;t)&nbsp;K. One arithmetic evaluation per step &mdash; no Newton, no atmosphere. This is the verification configuration where we compare against the closed-form analytical damping-depth solution.</div>
      <div class="why">
        <span class="lbl">Why Dirichlet</span>
        Once the surface temperature is determined by the SEB (or by the prescribed function), the top cell of the discretised column is <em>assigned that value</em>. The column then responds to the prescribed top temperature through conduction.
      </div>
    </div>

    <div class="bc bottom">
      <h3>BOTTOM &nbsp; (z = 2 m) &nbsp; &mdash; &nbsp; Zero-flux Neumann</h3>
      <div class="desc">Physically: 2 m is deeper than 14 damping depths &mdash; the daily wave is &lt;&nbsp;10<sup>&minus;6</sup> of the surface amplitude there.</div>
      <div class="eq-block">
        <div class="eq">&part;T<sub>s</sub>/&part;z |<sub>z=2m</sub> &nbsp;=&nbsp; 0 &nbsp;&Longleftrightarrow;&nbsp; G|<sub>z=2m</sub> = 0</div>
      </div>
      <div class="eq-block">
        <div class="eq" style="font-size:15px;">Discrete form: &nbsp; T<sub>N&minus;1</sub><sup>n+1</sup> &nbsp;=&nbsp; T<sub>N&minus;2</sub><sup>n+1</sup></div>
      </div>
      <div class="note">One line of code: the deepest cell <em>mirrors</em> the one above it, forcing the discrete gradient at the bottom face to zero, hence zero flux through that face. Reapplied at <b>every time step</b>.</div>
      <div class="note">Justified physically because, at 2 m, the column is well below the diurnal damping depth (8&ndash;14 cm). The temperature there is effectively the daily mean &mdash; nothing flows in or out over a 2-day integration.</div>
      <div class="why">
        <span class="lbl">Why Neumann (not Dirichlet)</span>
        We don't <em>know</em> the deep-soil temperature, but we <em>do</em> know the flux there should be zero. Specifying flux = 0 is physically defensible; specifying a fixed deep temperature would be guessing.
      </div>
    </div>

  </div>
  <div class="harm-band">
    <b>At every interior face between cells:</b> conductivity is the <em>harmonic mean</em> of the two cell-centre values:
    <span class="heq">&lambda;<sub>j+&frac12;</sub> = 2&lambda;<sub>j</sub>&lambda;<sub>j+1</sub> / (&lambda;<sub>j</sub> + &lambda;<sub>j+1</sub>)</span>
    Across a sharp jump (concrete deck &lambda; = 1.5 onto mineral-wool insulation &lambda; = 0.04), the harmonic mean is <b>0.078</b> &mdash; an order of magnitude smaller than the arithmetic mean (0.77). The harmonic mean preserves discrete flux conservation. The arithmetic mean would silently over-conduct heat across insulator interfaces by ~10&times;.
  </div>
</body>

  <div class="title-bar">
    <span class="badge">Test 2 algorithm</span>
    <span class="slide-title">Two sub-steps per &Delta;t &mdash; column first, SEB second &mdash; this order is the bug</span>
  </div>
  <div class="headline">Each Test 2 time step splits into sub-step A (column update with T<sub>s</sub><sup>0</sup> held fixed) and sub-step B (SEB Newton with the column held fixed). The split is the source of the operator-splitting error.</div>
  <div class="content">

    <div class="step">
      <div class="step-header a">
        <div class="label">A</div>
        <div>
          <h3>Column update &mdash; &theta;-method advance</h3>
          <div class="sub">holding T<sub>s</sub><sup>0</sup> fixed at its OLD value</div>
        </div>
      </div>
      <div class="step-body">
        <ol class="algo">
          <li><b>Hold surface temperature fixed:</b> set <code>T[0] = T_s_old</code> (value from end of previous step).</li>
          <li><b>Build half-level fluxes</b> using harmonic-mean conductivities (precomputed once at start). For each face j:&nbsp; <code>G_half[j] = lam_half[j] (T[j] &minus; T[j+1]) / dz_centre[j]</code>.</li>
          <li><b>Advance interior cells</b> 1..N&minus;2 with the &theta;-method update equation. Three cases:
            <ul style="margin-top:4px;">
              <li>&alpha; = 0&nbsp; (FTCS): direct arithmetic, one vectorised pass.</li>
              <li>&alpha; = &frac12; (CN) or &alpha; = 1 (BTCS): build tridiagonal system A&middot;T<sub>new</sub> = b; call <code>scipy.linalg.solve_banded</code>, O(N) cost.</li>
            </ul>
          </li>
          <li><b>Apply bottom BC:</b> <code>T_new[N&minus;1] = T_new[N&minus;2]</code> &mdash; zero-flux Neumann.</li>
        </ol>
        <div class="held">
          <b>Key:</b> during sub-step A, the column "thinks" the surface is still at <em>T<sub>s,old</sub><sup>0</sup></em>. The actual new T<sub>s</sub><sup>0</sup> is not yet known &mdash; we will compute it in sub-step B.
        </div>
      </div>
    </div>

    <div class="step">
      <div class="step-header b">
        <div class="label">B</div>
        <div>
          <h3>Surface energy balance &mdash; Newton iteration</h3>
          <div class="sub">holding the column fixed at its NEW values</div>
        </div>
      </div>
      <div class="step-body">
        <ol class="algo">
          <li><b>Evaluate atmospheric forcing</b> at t<sub>new</sub>: S&darr;(t), L&darr;(t), T<sub>a</sub>(t), U.</li>
          <li><b>Iterate Newton</b> on F(T<sub>s</sub><sup>0</sup>) = R<sub>n</sub> &minus; H &minus; LE &minus; G = 0:
            <ul style="margin-top:4px;">
              <li>Compute F and analytical Jacobian F&prime; at the current guess.</li>
              <li>Step: <code>T_s &larr; T_s &minus; F/F&prime;</code>.</li>
              <li>Stop when |&Delta;T| &lt; 10<sup>&minus;4</sup> K &mdash; usually <b>3&ndash;4 iterations</b>.</li>
            </ul>
          </li>
          <li><b>Write the converged surface temperature back to the top cell:</b> <code>T_new[0] = T_s</code>.</li>
          <li><b>Advance:</b> <code>T = T_new</code>, <code>t = t_new</code>. Record outputs (T<sub>s</sub><sup>0</sup>, G).</li>
        </ol>
        <div class="held">
          <b>Key:</b> during sub-step B, the column T[1..N&minus;1] is held at the values just computed in A. Only the surface cell T[0] is updated here. The G inside F uses the surface value being iterated and the (now-fixed) T[1].
        </div>
      </div>
    </div>

  </div>
  <div class="splitting-band">
    <b>Why this is the bug.</b> Order matters: in sub-step A the column relaxes toward the <em>old</em> surface; in sub-step B the surface jumps to a new value while the column is already partially adjusted. A truly coupled solver would advance the column AND the surface together. The split &mdash; approximating <em>e<sup>(A+B)&Delta;t</sup></em> as <em>e<sup>A&Delta;t</sup> &middot; e<sup>B&Delta;t</sup></em> &mdash; introduces an error proportional to the operator commutator [A,&nbsp;B]&middot;&Delta;t<sup>2</sup>/2, i.e. <b>first-order in &Delta;t</b>, regardless of how accurate each per-substep scheme is. This is exactly why we see 10:1 &Delta;t-refinement ratios for <em>both</em> BTCS and CN on slide 20, even though CN is intrinsically second-order.
  </div>

    '    grid-template-rows: auto !important;' +
    '    gap: 10px !important;' +
    '    padding-left: 14px !important;' +
    '    padding-right: 14px !important;' +
    '  }' +
    '  .footer-band {' +
    '    grid-template-columns: 1fr !important;' +
    '    gap: 10px !important;' +
    '    padding-left: 14px !important;' +
    '    padding-right: 14px !important;' +
    '  }' +
    '  .col, .card, .finding, .plot-card, .interp-card, .reasoning-card, .control-card, .footer-card {' +
    '    padding: 12px 14px !important;' +
    '  }' +
    '  .punch, .closing {' +
    '    margin: 0 14px 14px !important;' +
    '    font-size: 13px !important;' +
    '    padding: 8px 12px !important;' +
    '  }' +
    /* leave room at bottom for the floating nav arrows */
    '  body { padding-bottom: 80px !important; }' +
    /* slide 12 HTML category-legend bumped slightly so it reads
       cleanly alongside the bigger chart fonts */
    '  .cat-legend { font-size: 12px !important; }' +
    '  .cat-legend .dot { width: 16px !important; height: 11px !important; }' +
    /* SVG sizing on mobile — all chart SVGs use aspect-ratio so they
       render at their viewBox proportions, no stretching, crisp text.
       Slide 6 (svg.barplot) and slide 10 (svg.profile) get a
       portrait-friendly mobile viewBox (set in their JS) so the
       aspect-ratio here naturally fills the phone vertically. */
    '  .plot-card { flex: none !important; }' +    /* don\'t flex-grow past SVG */
    '  svg.barplot, svg.profile, svg.ratios, svg.shap, svg.tsplot,' +
    '  svg.uhi-plot, svg.err-plot, svg.col-diagram, svg.plot, svg.rmse-plot {' +
    '    width: 100% !important;' +
    '    height: auto !important;' +
    '    flex: none !important;' +
    '    min-height: 0 !important;' +
    '  }' +
    /* slide 6 and 10 use a TALL portrait viewBox on mobile (set in
       their JS), so the aspect-ratio here keeps the SVG filling the
       phone screen vertically without stretching text. */
    '  svg.barplot     { aspect-ratio: 1000 / 1000; }' +
    '  svg.profile     { aspect-ratio: 1000 / 1200; }' +
    '  svg.ratios      { aspect-ratio: 720 / 600; }' +     /* mobile uses taller viewBox */
    '  svg.shap        { aspect-ratio: 720 / 600; }' +     /* mobile uses taller viewBox */
    '  svg.tsplot      { aspect-ratio: 320 / 220; }' +
    '  svg.uhi-plot    { aspect-ratio: 540 / 280; }' +
    '  svg.err-plot    { aspect-ratio: 400 / 270; }' +
    '  svg.col-diagram { aspect-ratio: 320 / 250; }' +
    '  svg.plot        { aspect-ratio: 600 / 230; }' +
    '  svg.rmse-plot   { aspect-ratio: 600 / 280; }' +
    '}';
function injectMobileCSS(frame) {
    try {
        var doc = frame.contentDocument;
        if (!doc || !doc.head) return;
        // Ensure viewport meta — without it mobile browsers render the
        // iframe at the default 980 px width and shrink everything.
        if (!doc.querySelector('meta[name="viewport"]')) {
            var vp = doc.createElement('meta');
            vp.name = 'viewport';
            vp.content = 'width=device-width, initial-scale=1.0';
            doc.head.appendChild(vp);
        }
        var s = doc.createElement('style');
        s.textContent = MOBILE_CSS;
        doc.head.appendChild(s);
    } catch (ex) { /* cross-origin — skip */ }
}

// Build all iframes up-front so navigation is instantaneous.
for (var i = 0; i < totalSlides; i++) {
    var entry = SLIDE_ORDER[i];
    var frame = document.createElement('iframe');
    frame.className = 'slide-frame' + (i === 0 ? ' active' : '');
    frame.setAttribute('allow', 'fullscreen; autoplay');
    var isExternal = (typeof entry === 'string' && /\.html$/i.test(entry));
    if (isExternal) {
        // External file — relative paths inside the file resolve against the file itself.
        frame.src = entry;
    } else {
        // Inline textarea.
        var slideHtml = document.getElementById(entry).value;
        frame.srcdoc = slideHtml;
    }
    container.appendChild(frame);
    iframes.push(frame);
    // For srcdoc iframes (always same-origin) attach a contentWindow keydown
    // listener. For external-file iframes, do NOT — the postMessage relays
    // baked into those files are the sole nav path. Otherwise both fire and
    // each M-press skips a slide. This matters on GitHub Pages where external
    // iframes are also same-origin (unlike file://, where they were
    // cross-origin and the contentWindow attach silently failed).
    if (!isExternal) {
        (function (f) {
            f.addEventListener('load', function () {
                attachMKListener(f);
                injectMobileCSS(f);
            });
        })(frame);
    } else {
        // External iframes: try to inject mobile CSS too — works on Pages
        // (same-origin), no-ops silently on file:// (cross-origin).
        (function (f) {
            f.addEventListener('load', function () {
                injectMobileCSS(f);
            });
        })(frame);
    }
}

// Top-level M/K listener (caught here whenever the parent has focus).
window.addEventListener('keydown', function (e) {
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); prevSlide(); }
});

// Receive M/K relays from cross-origin (file://) iframes — figure slides 10,
// 14, 17-20 and the 3D viz at slot 16 are loaded via iframe.src. Chrome
// treats each file:// URL as a unique origin, so the contentWindow keydown
// listener from attachMKListener() silently SecurityError's. The relay
// scripts in those external HTML files post here instead.
window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'deck-nav') {
        if (e.data.dir === 'next') nextSlide();
        else if (e.data.dir === 'prev') prevSlide();
    }
});

// Initial slide-counter text and focus.
document.getElementById('slide-number').textContent = 'Slide 1 / ' + totalSlides;
if (iframes[0]) iframes[0].addEventListener('load', function () { iframes[0].focus(); });

// Touch/click nav arrows. Click for desktop; touchstart for mobile (avoids
// the ~300 ms click delay and the iOS "double-tap to zoom" trap).
(function () {
    var prevBtn = document.getElementById('nav-arrow-prev');
    var nextBtn = document.getElementById('nav-arrow-next');
    if (!prevBtn || !nextBtn) return;
    prevBtn.addEventListener('click', function (e) { e.preventDefault(); prevSlide(); });
    nextBtn.addEventListener('click', function (e) { e.preventDefault(); nextSlide(); });
    prevBtn.addEventListener('touchstart', function (e) { e.preventDefault(); prevSlide(); }, { passive: false });
    nextBtn.addEventListener('touchstart', function (e) { e.preventDefault(); nextSlide(); }, { passive: false });
    updateNavArrows();
})();
</script>
</body>
</html>
